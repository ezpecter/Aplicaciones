/* ------------------------------------------------- importar de Espacios
   El archivo que suelta la extensión trae mucho más de lo que aquí sirve:
   pestañas abiertas de paso, direcciones internas del navegador, estado de
   ventanas. Se queda con lo que tiene sentido lanzar desde una tablet.

   Cada espacio se trae como tú digas: sumando lo nuevo, reemplazándolo
   entero, o sin tocarlo. Así «ponerse al día» en uno no arrasa con los
   otros, que es justo lo que pasaría con un botón único. */
function ligasDelEspacio(sp, todas) {
  const tabs = Array.isArray(sp.tabs) ? sp.tabs : [];
  const vale = (t) => t && /^https?:/i.test(String(t.url || '')) && (todas || t.keep || t.home);

  /*
   * En el orden del archivo, sin tocarlo.
   *
   * Antes se reordenaba aquí, subiendo al principio las que `order` clavaba
   * arriba. Tenía sentido cuando el lanzador dibujaba todas las sueltas
   * juntas al principio; ahora que `orden` dice dónde va cada cosa, mover el
   * array solo sirve para desordenarte las pestañas dentro de cada sección al
   * devolverte el archivo. Dentro de un bloque, el orden ES el del array.
   */
  const ordenadas = tabs.filter(vale);

  // Una dirección, una liga: al reabrir la misma web en varios sitios la
  // extensión guarda registros distintos, aquí sobran. Se guarda `origenId`
  // para poder reencontrar su nota, que viene apuntando al id de allá.
  const vistas = new Set();
  const salida = [];
  for (const t of ordenadas) {
    const clave = String(t.url).replace(/#.*$/, '');
    if (vistas.has(clave)) continue;
    vistas.add(clave);
    salida.push({
      origenId: t.id,
      url: t.url,
      titulo: String(t.title || anfitrion(t.url) || t.url).trim(),
      seccionId: t.sectionId || null,
      // Lo que la extensión sabe de esta pestaña y aquí no se dibuja, pero
      // hay que devolverle intacto: si lo tiramos, al volver el archivo
      // estaría borrando datos suyos.
      estrella: !!t.keep,
      inicio: !!t.home,
      origen: t.origen || null,
      favicon: t.favIconUrl || ''
    });
  }
  return salida;
}

function leerArchivo(datos, todas) {
  const fuente = Array.isArray(datos && datos.spaces) ? datos.spaces : [];
  return fuente.map((sp) => ({
    idOrigen: sp.id,
    nombre: String(sp.name || 'Espacio'),
    icono: sp.icon || '🗂️',
    color: COLORES.includes(sp.color) ? sp.color : 'blue',
    secciones: (Array.isArray(sp.sections) ? sp.sections : []).map((x) => ({
      id: x.id, nombre: String(x.name || 'Sección'),
      color: COLORES.includes(x.color) ? x.color : 'grey',
      parentId: x.parentId || null,
      plegada: !!x.collapsed
    })),
    ligas: ligasDelEspacio(sp, todas),
    notas: (sp.notas && typeof sp.notas === 'object') ? sp.notas : {},
    orden: Array.isArray(sp.order) ? sp.order.slice() : [],
    total: (sp.tabs || []).length
  }));
}

/**
 * Trae un espacio del archivo a uno de los tuyos.
 *
 * `modo` es 'sumar' (añade lo que no tengas) o 'reemplazar' (deja el espacio
 * igual que el archivo). Reemplazar cambia el CONTENIDO, no la identidad: el
 * nombre, el icono y el color que le pusiste aquí se quedan, porque el mismo
 * espacio puede llamarse distinto en cada máquina y ese fue siempre el motivo
 * de que haya un importador en vez de una copia a pelo.
 *
 * Devuelve cuántas ligas entraron nuevas.
 */
function traerEspacio(destino, it, modo) {
  if (modo === 'reemplazar') { destino.secciones = []; destino.ligas = []; destino.notas = {}; destino.orden = []; }

  /*
   * Los ids del archivo se conservan si están libres.
   *
   * Dárselos nuevos siempre funcionaba, pero cambiaba la identidad de todo
   * cada vez que importabas: al devolver el archivo, la computadora recibía
   * sus propias secciones con nombres distintos por dentro. Ahora solo se
   * inventa un id cuando el de allá ya está ocupado aquí, que es el caso que
   * de verdad hacía falta cubrir (dos importaciones del mismo sitio).
   */
  const usados = new Set();
  for (const sp of E.espacios) {
    for (const l of sp.ligas) usados.add(l.id);
    for (const x of sp.secciones) usados.add(x.id);
  }
  const idPara = (original) => {
    const id = (original && !usados.has(original)) ? original : uid();
    usados.add(id);
    return id;
  };

  // Las secciones llegan con los ids del archivo; se les dan ids nuevos y se
  // traduce la referencia de cada liga. Sin esto, dos importaciones seguidas
  // mezclarían secciones distintas que comparten id.
  const mapaSec = new Map();
  for (const x of it.secciones) {
    const gemela = destino.secciones.find((y) => y.nombre.toLowerCase() === x.nombre.toLowerCase());
    if (gemela) { mapaSec.set(x.id, gemela.id); continue; }
    const nueva = { id: idPara(x.id), nombre: x.nombre, color: x.color, parentId: x.parentId,
                    ...(x.plegada ? { plegada: true } : {}) };
    destino.secciones.push(nueva);
    mapaSec.set(x.id, nueva.id);
  }
  for (const x of destino.secciones) if (x.parentId && mapaSec.has(x.parentId)) x.parentId = mapaSec.get(x.parentId);

  const mapaLiga = new Map();
  const porUrl = new Map(destino.ligas.map((l) => [String(l.url).replace(/#.*$/, ''), l]));
  let nuevas = 0;
  for (const l of it.ligas) {
    const clave = String(l.url).replace(/#.*$/, '');
    const ya = porUrl.get(clave);
    if (ya) { mapaLiga.set(l.origenId, ya.id); continue; }  // repetida: su nota va a la que ya tienes
    const liga = {
      id: idPara(l.origenId), url: l.url, titulo: l.titulo,
      seccionId: l.seccionId ? (mapaSec.get(l.seccionId) || null) : null,
      estrella: l.estrella !== false,
      ...(l.inicio ? { inicio: true } : {}),
      ...(l.origen ? { origen: l.origen } : {}),
      ...(l.favicon ? { favicon: l.favicon } : {})
    };
    destino.ligas.push(liga);
    porUrl.set(clave, liga);
    mapaLiga.set(l.origenId, liga.id);
    nuevas++;
  }

  // Las notas vienen con las claves de allá (`t:` para pestañas). Se traducen
  // a las de aquí; las que apunten a algo que no se trajo se quedan fuera.
  for (const [clave, nota] of Object.entries(it.notas)) {
    if (!nota || !String(nota.texto || '').trim()) continue;
    const [tipo, idViejo] = String(clave).split(':');
    const destinoId = tipo === 't' ? mapaLiga.get(idViejo)
                    : tipo === 's' ? mapaSec.get(idViejo)
                    : null;
    if (!destinoId) continue;
    destino.notas[(tipo === 't' ? 'l:' : 's:') + destinoId] = {
      texto: String(nota.texto),
      color: COLORES.includes(nota.color) ? nota.color : 'yellow',
      actualizado: nota.actualizado || Date.now()
    };
  }

  /*
   * Y el orden del primer nivel, que es donde vive la posición del bloque
   * «Sin sección». Las llaves vienen con los ids de allá: hay que traducirlas
   * con los mapas que acabamos de construir. Las que apunten a algo que no se
   * trajo se caen, y `ordenTop()` rellenará lo que falte.
   */
  const traducido = [];
  for (const k of it.orden) {
    if (k === '__none__') { traducido.push('__none__'); continue; }
    if (String(k).startsWith('t:')) {
      const id = mapaLiga.get(String(k).slice(2));
      if (id) traducido.push('l:' + id);
      continue;
    }
    const id = mapaSec.get(k);
    if (id) traducido.push(id);
  }
  if (modo === 'reemplazar') {
    destino.orden = traducido;
  } else {
    // Sumando, lo tuyo manda: solo se añade lo que aquí no estaba.
    const ya = new Set(destino.orden || []);
    destino.orden = [...(destino.orden || []), ...traducido.filter((k) => k !== '__none__' && !ya.has(k))];
  }
  destino.orden = ordenTop(destino);

  return nuevas;
}

/**
 * La hoja de importar. Con `previo` ({ datos, etiqueta, ts }) viene de la
 * carpeta y ya trae el archivo leído; sin él, lo eliges a mano.
 */
function hojaImportar(previo = null) {
  abrirHoja((card) => {
    card.append(el('h3', null, previo ? 'Traer una copia' : 'Importar de Espacios'));

    const av = el('div', 'aviso');
    av.textContent = previo
      ? `De ${previo.etiqueta}. Elige espacio por espacio qué hacer: nada se toca salvo lo que marques.`
      : 'Coge el archivo que exporta la extensión. Elige espacio por espacio qué hacer con él.';
    card.append(av);

    let datos = previo ? previo.datos : null;

    if (!previo) {
      const file = el('input');
      file.type = 'file'; file.accept = '.json,application/json';
      card.append(campo('Archivo', file));
      file.onchange = () => {
        const f = file.files && file.files[0];
        if (!f) return;
        const lector = new FileReader();
        lector.onload = () => {
          try {
            datos = JSON.parse(String(lector.result));
            if (!datos || !Array.isArray(datos.spaces)) throw new Error('sin spaces');
            repintar();
          } catch {
            datos = null;
            zona.textContent = '';
            zona.append(el('div', 'aviso', 'Ese archivo no es una exportación de Espacios.'));
          }
        };
        lector.readAsText(f);
      };
    }

    const lTodas = el('label', 'conmutador');
    const cTodas = el('input'); cTodas.type = 'checkbox'; cTodas.className = 'imp-check';
    lTodas.append(cTodas, el('div', 'imp-txt', 'Traer también las que no tienen estrella'));
    const pista = el('div', 'imp-det');
    pista.style.margin = '-4px 2px 12px';
    pista.textContent = 'Llegan marcadas «de paso» y se filtran aparte. Útiles para rebuscar aquello que abriste y no guardaste.';
    card.append(lTodas, pista);

    // El atajo que pediste: dejarlo todo igual que la copia, de un toque,
    // sin renunciar a poder cambiar un espacio suelto después.
    const alDia = el('button', 'foot-btn');
    alDia.textContent = 'Poner todos al día';
    alDia.title = 'Marca reemplazar en todos los que ya tienes';
    alDia.onclick = () => {
      // Solo reemplaza donde hay pareja. Buscar «la primera opción de
      // reemplazar» mandaría un espacio sin pareja encima de otro ajeno:
      // un espacio arrasado por otro que no tiene nada que ver.
      for (const sel of zona.querySelectorAll('select')) {
        sel.value = sel.dataset.gemelo ? 'reemplazar:' + sel.dataset.gemelo : 'nuevo:';
      }
    };

    const zona = el('div');
    card.append(zona);

    function repintar() {
      zona.textContent = '';
      if (!datos) return;
      const lista = leerArchivo(datos, cTodas.checked);
      if (!lista.length) { zona.append(el('div', 'aviso', 'El archivo no trae espacios.')); return; }

      zona.append(alDia);
      const filas = new Map();
      for (const it of lista) {
        const f = el('div', 'imp-esp');
        const txt = el('div', 'imp-txt');
        txt.append(el('div', 'imp-nom', it.icono + '  ' + it.nombre));
        const cuantas = Object.keys(it.notas).length;
        const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
        txt.append(el('div', 'imp-det',
          `${plural(it.ligas.length, 'liga', 'ligas')} de ${plural(it.total, 'pestaña', 'pestañas')}`
          + (cuantas ? ` · ${plural(cuantas, 'nota', 'notas')}` : '')));

        // Destino y modo en un solo selector: en una columna estrecha, dos
        // desplegables por fila no caben de forma legible.
        const sel = el('select');
        const nada = el('option', null, 'No traer'); nada.value = 'no:';
        const comoNuevo = el('option', null, 'Como espacio nuevo'); comoNuevo.value = 'nuevo:';
        sel.append(nada, comoNuevo);
        let gemelo = null;
        for (const sp of E.espacios) {
          const mismo = sp.nombre.trim().toLowerCase() === it.nombre.trim().toLowerCase();
          if (mismo) gemelo = sp;
          const a = el('option', null, `Sumar en ${sp.nombre}`); a.value = 'sumar:' + sp.id;
          const b = el('option', null, `Reemplazar ${sp.nombre}`); b.value = 'reemplazar:' + sp.id;
          sel.append(a, b);
        }
        // Por defecto, lo prudente: sumar sobre el que ya se llama igual, y
        // como nuevo si aquí no existe. Reemplazar siempre se pide a mano.
        sel.dataset.gemelo = gemelo ? gemelo.id : '';
        sel.value = gemelo ? 'sumar:' + gemelo.id : (it.ligas.length ? 'nuevo:' : 'no:');

        f.append(txt, sel);
        zona.append(f);
        filas.set(it, sel);
      }
      zona._plan = { lista, filas };
    }

    cTodas.onchange = repintar;
    if (previo) repintar();

    botones(card, 'Traer', async () => {
      const plan = zona._plan;
      if (!plan) return brindis('Elige primero un archivo');

      let nuevas = 0, tocados = 0;
      for (const it of plan.lista) {
        const [modo, id] = plan.filas.get(it).value.split(':');
        if (modo === 'no') continue;

        let destino = id ? E.espacios.find((sp) => sp.id === id) : null;
        if (!destino) {
          destino = { id: uid(), nombre: it.nombre, icono: it.icono, color: it.color,
                      secciones: [], ligas: [], notas: {} };
          E.espacios.push(destino);
        }
        if (!destino.notas) destino.notas = {};
        nuevas += traerEspacio(destino, it, modo);
        tocados++;
      }

      for (const pin of (Array.isArray(datos.pinned) ? datos.pinned : [])) {
        if (!/^https?:/i.test(String(pin.url || ''))) continue;
        if (E.ancladas.some((a) => a.url === pin.url)) continue;
        E.ancladas.push({ id: uid(), url: pin.url, titulo: String(pin.title || anfitrion(pin.url)) });
      }

      // Lo que venía en el archivo y aquí no se dibuja, guardado para
      // devolvérselo tal cual la próxima vez que exportes.
      if (datos.settings && typeof datos.settings === 'object') {
        E.ajustes.equipaje = {
          settings: datos.settings,
          version: typeof datos.version === 'string' ? datos.version : undefined,
          v: typeof datos.v === 'number' ? datos.v : undefined,
          winSpaces: (datos.winSpaces && typeof datos.winSpaces === 'object') ? datos.winSpaces : undefined
        };
      }

      // Esta copia ya está vista: el aviso de «hay una nueva» se apaga.
      if (previo?.ts) E.ajustes.carpetaVisto = previo.ts;

      await guardar(); cerrarHoja(); pintar(); pintarAvisoCarpeta();
      const esp = `${tocados} ${tocados === 1 ? 'espacio' : 'espacios'}`;
      brindis(!tocados ? 'No marcaste ningún espacio'
            : nuevas ? `${nuevas === 1 ? '1 liga nueva' : nuevas + ' ligas nuevas'} en ${esp}`
            : `${esp} al día`);
    });
  });
}

/* ------------------------------------------------------------- exportar
   Un solo tipo de archivo en las dos direcciones.
   
   El lanzador escribía lo suyo, con su propio formato y su propio nombre, y
   eso rompía el viaje de vuelta: la extensión no lo entendía y la carpeta no
   lo reconocía como copia. Ahora escribe EXACTAMENTE lo que escribe la
   extensión —`espacios-AAAA-MM-DD-HHMMSS.json`, con `spaces` dentro—, así que
   lo que añadas en la tablet lo puede traer la computadora.

   Cada liga sale con estrella puesta. Es lo que son: si llegaran sin ella,
   la extensión las trataría como restos de una sesión anterior. */
function aFormatoEspacios() {
  const spaces = E.espacios.map((sp) => {
    const notas = {};
    for (const [clave, n] of Object.entries(sp.notas || {})) {
      if (!n || !String(n.texto || '').trim()) continue;
      const [tipo, id] = String(clave).split(':');
      // Allá las pestañas son `t:`; aquí las ligas son `l:`.
      notas[(tipo === 'l' ? 't:' : 's:') + id] = {
        texto: String(n.texto),
        color: n.color || 'yellow',
        actualizado: n.actualizado || Date.now()
      };
    }

    return {
      id: sp.id,
      name: sp.nombre,
      icon: sp.icono,
      color: sp.color,
      sections: sp.secciones.map((x) => ({
        id: x.id, name: x.nombre, color: x.color,
        collapsed: !!x.plegada, parentId: x.parentId || null
      })),
      /*
       * El orden tal cual, con `__none__` donde esté. Antes se reinventaba
       * aquí —todas las sueltas como `t:` y el bloque detrás—, y eso llegaba
       * a la extensión como un orden que nadie había pedido.
       */
      order: ordenTop(sp).map((k) => (String(k).startsWith('l:') ? 't:' + k.slice(2) : k)),
      tabs: sp.ligas.map((l) => {
        const con = l.estrella !== false;
        return {
          id: l.id,
          tabId: null,
          win: null,
          url: l.url,
          title: l.titulo,
          favIconUrl: l.favicon || '',
          sectionId: l.seccionId || null,
          keep: con,
          // `home` y `origen` solo significan algo con estrella: así lo trata
          // la extensión, y así se los devolvemos.
          ...(con && l.inicio ? { home: true } : {}),
          origen: con ? (l.origen || l.url) : null,
          session: !con,
          discarded: true
        };
      }),
      notas
    };
  });

  /*
   * El equipaje: los ajustes de la extensión, que viajaron en el archivo que
   * importaste y aquí no se tocan.
   *
   * Hay que devolverlos. Al «reemplazar todo», la extensión se queda con los
   * `settings` DEL ARCHIVO; si mandáramos uno vacío, ponerte al día en la
   * computadora te resetearía sus ajustes. Si nunca importaste nada no hay
   * equipaje, y entonces la clave se omite en vez de ir vacía.
   */
  const equipaje = E.ajustes?.equipaje || {};

  return {
    app: 'espacios',
    version: equipaje.version || '1.30.0',
    origen: 'lanzador',          // de dónde salió, por si alguna vez importa
    exportedAt: new Date().toISOString(),
    counts: {
      spaces: spaces.length,
      tabs: spaces.reduce((n, x) => n + x.tabs.length, 0),
      pinned: E.ancladas.length
    },
    v: equipaje.v || 1,
    spaces,
    pinned: E.ancladas.map((a) => ({ id: a.id, url: a.url, title: a.titulo, tabId: null, tabIds: {} })),
    ...(equipaje.winSpaces ? { winSpaces: equipaje.winSpaces } : { winSpaces: {} }),
    ...(equipaje.settings ? { settings: equipaje.settings } : {}),
    activeSpaceId: activo
  };
}

/** El mismo nombre con fecha que usa la extensión: así la carpeta lo ve. */
function nombreDeCopia(f = new Date()) {
  const dos = (n) => String(n).padStart(2, '0');
  return `espacios-${f.getFullYear()}-${dos(f.getMonth() + 1)}-${dos(f.getDate())}`
       + `-${dos(f.getHours())}${dos(f.getMinutes())}${dos(f.getSeconds())}.json`;
}

/**
 * Guarda una copia en tu carpeta. Devuelve el nombre, o null si no se pudo.
 *
 * El permiso de escritura se pide aquí dentro porque tiene que salir de tu
 * toque: si se pidiera antes, el navegador lo rechazaría sin decir por qué.
 */
async function guardarEnCarpeta() {
  const handle = await Carpeta.recordada();
  if (!handle) { brindis('Antes hay que elegir una carpeta'); return null; }
  if (!Carpeta.sabeEscribir()) { brindis('Este navegador no deja escribir en carpetas'); return null; }
  if (!(await Carpeta.permiso(handle, true, 'readwrite'))) {
    brindis('Sin permiso de escritura no se puede guardar ahí');
    return null;
  }
  try {
    const nombre = await Carpeta.guardar(handle, aFormatoEspacios(), nombreDeCopia());
    // La copia que acabo de escribir soy yo: no tiene sentido que el aviso
    // me diga a continuación que «hay una copia nueva».
    const f = Carpeta.fechaDelNombre(nombre);
    if (f) E.ajustes.carpetaVisto = f.getTime();
    await guardar();
    pintarAvisoCarpeta();
    return nombre;
  } catch (e) {
    brindis('No se pudo escribir: ' + (e?.name || 'error'));
    return null;
  }
}

function exportar() {
  const blob = new Blob([JSON.stringify(aFormatoEspacios(), null, 2)], { type: 'application/json' });
  const a = el('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombreDeCopia();
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  return a.download;
}

/* ----------------------------------------------------- hoja: la carpeta */

/** Cuando el navegador no trae la API. Pasa en Brave (viene apagada) y en
 *  Firefox y Safari (no la quieren). Decirlo y dar la salida que sí hay. */
function hojaSinApi(card) {
  card.append(el('div', 'aviso', 'Este navegador no deja elegir una carpeta. En Brave viene apagado de fábrica y se puede encender; en Firefox y Safari no existe.'));

  const pasos = el('ol', 'pasos');
  const uno = el('li');
  uno.append(document.createTextNode('En Brave, abre '), el('code', null, 'brave://flags/#file-system-access-api'));
  const dos = el('li', null, 'Ponlo en «Enabled» y reinicia el navegador.');
  const tres = el('li', null, 'Vuelve aquí y elige la carpeta. En Chrome ya viene encendido.');
  pasos.append(uno, dos, tres);
  card.append(pasos);

  grupo(card,
    opcion('⧉', 'Copiar la dirección del ajuste', async () => {
      try { await navigator.clipboard.writeText('brave://flags/#file-system-access-api'); brindis('Copiada: pégala en una pestaña'); }
      catch { brindis('No se pudo copiar'); }
      cerrarHoja();
    }),
    opcion('↓', 'Traer un archivo a mano', () => hojaImportar(),
      { clase: 'destacada', nota: 'Un paso más, lo mismo al final' })
  );
}

/**
 * La carpeta por dentro: qué copias hay y qué hacer con ellas.
 *
 * Pedir el permiso tiene que salir de un toque, así que se pide aquí y no
 * al arrancar. Si hace falta, la pantalla lo dice y lo pide con un botón.
 */
function hojaCarpeta() {
  abrirHoja(async (card) => {
    card.append(el('h3', null, 'Carpeta de copias'));

    if (!Carpeta.hayApi()) return hojaSinApi(card);

    const cuerpo = el('div');
    card.append(cuerpo);

    const elegir = async () => {
      try {
        const h = await Carpeta.elegir();
        E.ajustes.carpetaNombre = h.name;
        await guardar();
        cerrarHoja(); hojaCarpeta();
      } catch { /* la cerró sin elegir */ }
    };

    const handle = await Carpeta.recordada();

    if (!handle) {
      cuerpo.append(el('div', 'aviso', 'Elige la carpeta donde la extensión guarda sus copias. Aquí podrás traerlas y guardar las tuyas. Nunca se borra ni se pisa nada: cada copia es un archivo nuevo con su fecha.'));
      grupo(cuerpo, opcion('📁', 'Elegir la carpeta', elegir, { clase: 'destacada' }));
      const nota = el('div', 'imp-det');
      nota.style.marginTop = '10px';
      nota.textContent = 'Si la sincronizas con Drive, OneDrive o Syncthing, lo que exportes en la computadora aparece aquí solo.';
      cuerpo.append(nota);
      return;
    }

    cabecera(cuerpo, handle.name || 'Carpeta', 'Se lee y se escribe; nada se borra', null);

    if (!(await Carpeta.permiso(handle, false))) {
      cuerpo.append(el('div', 'aviso', 'El navegador olvidó el permiso al cerrar. Hay que volver a concederlo, y eso tiene que salir de un toque tuyo.'));
      grupo(cuerpo,
        opcion('🔓', 'Dar permiso de lectura', async () => {
          if (await Carpeta.permiso(handle, true)) { cerrarHoja(); hojaCarpeta(); }
          else brindis('Sin permiso no se puede leer la carpeta');
        }, { clase: 'destacada' }),
        opcion('📁', 'Elegir otra carpeta', elegir)
      );
      return;
    }

    let copias = [];
    try { copias = await Carpeta.listar(handle); }
    catch { cuerpo.append(el('div', 'aviso', 'No se pudo leer la carpeta.')); return; }

    grupo(cuerpo,
      opcion('⇅', 'Guardar una copia aquí', async () => {
        const nombre = await guardarEnCarpeta();
        if (nombre) { cerrarHoja(); hojaCarpeta(); brindis('Guardada como ' + nombre); }
      }, { clase: 'destacada',
           nota: `${E.espacios.length} ${E.espacios.length === 1 ? 'espacio' : 'espacios'} · la computadora podrá traerla` })
    );

    if (!copias.length) {
      cuerpo.append(el('div', 'aviso', 'Todavía no hay copias aquí. Guarda una, o exporta desde la extensión a esta carpeta.'));
    } else {
      const traer = async (copia) => {
        try {
          const leida = await Carpeta.leer(handle, copia.nombre);
          if (!leida || !Array.isArray(leida.datos?.spaces)) throw new Error('formato');
          cerrarHoja();
          hojaImportar({ datos: leida.datos, ts: leida.ts, etiqueta: hace(copia.ts) });
        } catch { brindis('Esa copia no se pudo leer'); }
      };

      const lista = el('div', 'grupo');
      copias.slice(0, 12).forEach((c, i) => {
        const b = el('button', 'copia');
        const txt = el('div', 'cuando', hace(c.ts));
        txt.append(el('small', null, new Date(c.ts).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' })));
        b.append(txt);
        if (i === 0) b.append(el('span', 'insignia', 'la última'));
        b.onclick = () => traer(c);
        lista.append(b);
      });
      cuerpo.append(lista);
      const pie = el('div', 'imp-det');
      pie.textContent = (copias.length > 12
        ? `${copias.length} copias; se enseñan las 12 más recientes.`
        : `${copias.length} ${copias.length === 1 ? 'copia' : 'copias'}.`)
        + ' Las viejas las limpia la extensión al guardar, que deja las diez últimas.';
      cuerpo.append(pie);
    }

    grupo(cuerpo,
      opcion('📁', 'Elegir otra carpeta', elegir),
      opcion('✕', 'Olvidar esta carpeta', async () => {
        await Carpeta.olvidar();
        delete E.ajustes.carpetaNombre;
        delete E.ajustes.carpetaVisto;
        await guardar(); cerrarHoja(); pintarAvisoCarpeta();
        brindis('Olvidada: no se vuelve a mirar');
      }, { clase: 'mal', nota: 'No borra nada del disco' })
    );
  });
}

/* ----------------------------------------------- el aviso de copia nueva
   Se mira al abrir, pero solo si el permiso sigue concedido: pedirlo exige
   un toque y no vamos a sacar una ventana del sistema a traición. */
async function pintarAvisoCarpeta() {
  const caja = $('#avisoCarpeta');
  caja.textContent = '';
  if (!Carpeta.hayApi()) return;

  let handle, copias;
  try {
    handle = await Carpeta.recordada();
    if (!handle) return;
    if (!(await Carpeta.permiso(handle, false))) return;
    copias = await Carpeta.listar(handle);
  } catch { return; }

  const ultima = copias && copias[0];
  if (!ultima) return;
  if (ultima.ts <= (E.ajustes.carpetaVisto || 0)) return;

  const b = el('button', 'aviso pulsable');
  b.append(el('span', null, `Hay una copia nueva, de ${hace(ultima.ts)}`));
  b.append(el('span', 'ir', 'Traer'));
  b.onclick = async () => {
    try {
      const leida = await Carpeta.leer(handle, ultima.nombre);
      if (!leida || !Array.isArray(leida.datos?.spaces)) throw new Error('formato');
      hojaImportar({ datos: leida.datos, ts: leida.ts, etiqueta: hace(ultima.ts) });
    } catch { brindis('Esa copia no se pudo leer'); }
  };
  caja.append(b);
}

    grupo(card,
      opcion('📁', 'Carpeta de copias',

      }, { clase: 'destacada',

        brindis('Descargada como ' + nombre);
      }, { nota: `${resumen} · lo lee la extensión` }),
      opcion('⟲', 'Reemplazar todo con un archivo', () => {
        const f = el('input'); f.type = 'file'; f.accept = '.json,application/json';
        f.onchange = () => {
          const arch = f.files && f.files[0];
          if (!arch) return;
          const lector = new FileReader();
          lector.onload = async () => {
            let d;
            try { d = JSON.parse(String(lector.result)); } catch { return brindis('Ese archivo no se puede leer'); }

            // Formato Espacios: el de ahora, y el que trae la extensión.
            if (Array.isArray(d.spaces)) {
              if (!confirm('Esto reemplaza TODOS tus espacios con los del archivo. ¿Seguir?')) return;
              const lista = leerArchivo(d, false);
              E.espacios = [];
              for (const it of lista) {
                const destino = { id: it.idOrigen || uid(), nombre: it.nombre, icono: it.icono,
                                  color: it.color, secciones: [], ligas: [], notas: {} };
                E.espacios.push(destino);
                traerEspacio(destino, it, 'reemplazar');
              }
              E.ancladas = (Array.isArray(d.pinned) ? d.pinned : [])
                .filter((x) => /^https?:/i.test(String(x.url || '')))
                .map((x) => ({ id: uid(), url: x.url, titulo: String(x.title || anfitrion(x.url)) }));
              if (d.settings && typeof d.settings === 'object') {
                E.ajustes.equipaje = { settings: d.settings, version: d.version, v: d.v,
                                       winSpaces: d.winSpaces };
              }
              if (!E.espacios.length) E.espacios = estadoVacio().espacios;
              activo = E.espacios[0].id;
              await guardar(); cerrarHoja(); pintar(); brindis('Reemplazado');
              return;
            }

            // Formato viejo del lanzador, por si guardaste alguno antes.
            if (Array.isArray(d.espacios)) {
              if (!confirm('Esto reemplaza todo lo que tienes aquí. ¿Seguir?')) return;
              E = { app: 'lanzador', v: 1, espacios: d.espacios,
                    ancladas: d.ancladas || [], ajustes: E.ajustes || {} };
              activo = E.espacios[0] && E.espacios[0].id;
              await guardar(); cerrarHoja(); pintar(); brindis('Restaurado');
              return;
            }

            brindis('Ese archivo no es una copia de Espacios');
          };
          lector.readAsText(arch);
        };
        f.click();
      }, { nota: 'Borra lo de aquí y deja lo del archivo' })
    );

    const activos = !!(E.ajustes && E.ajustes.favicons);
    grupo(card,
      opcion(activos ? '☑' : '☐', 'Usar los iconos de cada web', async () => {
        E.ajustes = E.ajustes || {};
        E.ajustes.favicons = !activos;
        await guardar(); cerrarHoja(); pintar();
      }, { nota: 'Pide red; si no, van las iniciales' })
    );

    const nota = el('div', 'aviso');
    nota.textContent = Almacen.modo === 'memoria'
      ? 'Aquí no hay dónde guardar: al cerrar se pierde. Exporta antes de salir.'
      : 'Se guarda en este dispositivo. El archivo que exportas es el mismo que usa la extensión, así que vale para las dos máquinas.';
    card.append(nota);

    if (invitacion) {
      grupo(card,
        opcion('⊕', 'Instalar en el dispositivo', async () => {
          const inv = invitacion;
          cerrarHoja();
          invitacion = null;
          inv.prompt();
          try { await inv.userChoice; } catch { /* la cerró */ }
        }, { clase: 'destacada', nota: 'Icono propio, sin barra del navegador' })
      );
    }
  });
}

/* ==========================================================================
   Arrastre táctil
   --------------------------------------------------------------------------
   Mismas reglas que en la extensión, traducidas al dedo:

     · una liga sobre otra liga  → se coloca antes o después, en su sección
     · una liga sobre una cabecera → entra en esa sección, al final
     · una liga sobre un chip del riel → se muda a ese espacio
     · una sección sobre otra cabecera → se ordena a ese mismo nivel
     · una sección sobre el cuerpo de otra → se vuelve subsección suya

   Lo delicado aquí es el desplazamiento. En táctil no puedes decidir a mitad
   de gesto que ya no era un scroll: si el navegador empezó a desplazar, es
   suyo. Por eso hay que MANTENER PULSADO sin mover — si el dedo se va antes
   de tiempo, era un deslizamiento y no lo tocamos; y si aguanta, bloqueamos
   el desplazamiento antes de que empiece.

   El menú de cada liga se movió al botón ⋯, porque mantener pulsado ya no
   puede significar dos cosas.
   ========================================================================== */
const Arrastre = (() => {
  const ESPERA = 380;   // ms aguantando para que se levante
  const FUGA = 10;      // px de movimiento que delatan un deslizamiento
  const BORDE = 72;     // franja donde la lista se desplaja sola

  let espera = null;    // temporizador de la pulsación larga
  let salida = null;    // { x, y, tipo, id, nodo } antes de levantar
  let vivo = null;      // { tipo, id, nodo, fantasma, dx, dy }
  let destino = null;
  let bloqueo = null;
  let rueda = null;
  let velocidad = 0;
  let ignorarClick = false;

  const limpiar = () => {
    for (const n of document.querySelectorAll('.suelta-antes, .suelta-despues, .suelta-dentro, .chip.recibe')) {
      n.classList.remove('suelta-antes', 'suelta-despues', 'suelta-dentro', 'recibe');
    }
  };

  function cancelarEspera() {
    clearTimeout(espera); espera = null; salida = null;
  }

  /* ------------------------------------------------------------- levantar */
  function levantar(x, y) {
    const { tipo, id, nodo } = salida;
    salida = null;

    const caja = nodo.getBoundingClientRect();
    const fantasma = nodo.cloneNode(true);
    fantasma.className = 'fantasma ' + nodo.className;
    fantasma.classList.remove('levantada');
    fantasma.style.width = caja.width + 'px';
    document.body.append(fantasma);

    vivo = { tipo, id, nodo, fantasma, dx: x - caja.left, dy: y - caja.top };
    nodo.classList.add('levantada');
    navigator.vibrate?.(12);

    // Bloquea el desplazamiento mientras dure. Sin `passive: false` el
    // navegador ignora el preventDefault y la lista se movería igual.
    bloqueo = (ev) => ev.preventDefault();
    document.addEventListener('touchmove', bloqueo, { passive: false });

    colocarFantasma(x, y);
  }

  const colocarFantasma = (x, y) => {
    vivo.fantasma.style.transform = `translate(${x - vivo.dx}px, ${y - vivo.dy}px) scale(1.02)`;
  };

  /* --------------------------------------------------------- a dónde cae */
  function calcular(x, y) {
    const bajo = document.elementFromPoint(x, y);
    if (!bajo || !bajo.closest) return null;

    if (vivo.tipo === 'liga') {
      const chip = bajo.closest('.chip[data-espacio]');
      if (chip && chip.dataset.espacio !== activo) {
        return { tipo: 'espacio', id: chip.dataset.espacio, nodo: chip, clase: 'recibe' };
      }
      const otra = bajo.closest('.liga[data-liga]');
      if (otra && otra.dataset.liga !== vivo.id) {
        const c = otra.getBoundingClientRect();
        const despues = y > c.top + c.height / 2;
        return { tipo: despues ? 'despues' : 'antes', id: otra.dataset.liga, nodo: otra,
                 clase: despues ? 'suelta-despues' : 'suelta-antes' };
      }
      const cab = bajo.closest('.sec-head[data-sec-head]');
      if (cab) return { tipo: 'seccion', id: cab.dataset.secHead, nodo: cab, clase: 'suelta-dentro' };
      if (bajo.closest('#cuerpo')) return { tipo: 'sueltas', id: null, nodo: null };
      return null;
    }

    // Arrastrando una sección
    const cab = bajo.closest('.sec-head[data-sec-head]');
    if (cab && cab.dataset.secHead !== vivo.id) {
      const c = cab.getBoundingClientRect();
      const despues = y > c.top + c.height / 2;
      return { tipo: despues ? 'despues' : 'antes', id: cab.dataset.secHead, nodo: cab,
               clase: despues ? 'suelta-despues' : 'suelta-antes' };
    }
    const dentro = bajo.closest('.sec[data-sec]');
    if (dentro && dentro.dataset.sec !== vivo.id) {
      return { tipo: 'anidar', id: dentro.dataset.sec, nodo: dentro, clase: 'suelta-dentro' };
    }
    return null;
  }

  function mover(x, y) {
    colocarFantasma(x, y);
    limpiar();
    destino = calcular(x, y);
    if (destino && destino.nodo) destino.nodo.classList.add(destino.clase);

    // Desplazamiento automático al acercarse a los bordes.
    const caja = $('#scroll').getBoundingClientRect();
    velocidad = y < caja.top + BORDE ? -12 : y > caja.bottom - BORDE ? 12 : 0;
    if (velocidad && !rueda) {
      const girar = () => {
        if (!vivo || !velocidad) { rueda = null; return; }
        $('#scroll').scrollTop += velocidad;
        rueda = requestAnimationFrame(girar);
      };
      rueda = requestAnimationFrame(girar);
    }
  }

  /* --------------------------------------------------------- recolocar */

  /** Saca la liga de donde esté y la mete en su nuevo sitio. */
  function reubicarLiga(sp, liga, seccionId, refId, despues) {
    // Si estaba clavada en un punto del primer nivel, al moverla a mano deja
    // de estarlo y vuelve al bloque «Sin sección», donde la acabas de soltar.
    sp.orden = (sp.orden || []).filter((k) => k !== 'l:' + liga.id);
    sp.ligas = sp.ligas.filter((x) => x !== liga);
    liga.seccionId = seccionId || null;
    if (refId) {
      const i = sp.ligas.findIndex((x) => x.id === refId);
      sp.ligas.splice(i < 0 ? sp.ligas.length : i + (despues ? 1 : 0), 0, liga);
      return;
    }
    // Sin referencia: al final de su grupo, que es donde se espera que caiga
    // lo que sueltas sobre una cabecera.
    let ultimo = -1;
    sp.ligas.forEach((x, i) => { if ((x.seccionId || null) === (liga.seccionId || null)) ultimo = i; });
    sp.ligas.splice(ultimo + 1, 0, liga);
  }

  function reubicarSeccion(sp, sec, parentId, refId, despues) {
    sp.secciones = sp.secciones.filter((x) => x !== sec);
    sec.parentId = parentId || null;
    if (refId) {
      const i = sp.secciones.findIndex((x) => x.id === refId);
      sp.secciones.splice(i < 0 ? sp.secciones.length : i + (despues ? 1 : 0), 0, sec);
    } else {
      sp.secciones.push(sec);
    }

    // El primer nivel lo manda `orden`, no el array: si no se toca aquí, la
    // sección se movería en los datos y se quedaría quieta en la pantalla.
    sp.orden = (sp.orden || []).filter((k) => k !== sec.id);
    if (!sec.parentId) {
      const j = refId ? sp.orden.indexOf(refId) : -1;
      if (j >= 0) sp.orden.splice(j + (despues ? 1 : 0), 0, sec.id);
      else sp.orden.push(sec.id);
    }
  }

  async function soltar(arr, dest) {
    const sp = espacio();

    if (arr.tipo === 'liga') {
      const liga = sp.ligas.find((x) => x.id === arr.id);
      if (liga && dest) {
        if (dest.tipo === 'espacio') {
          const otro = E.espacios.find((s) => s.id === dest.id);
          sp.ligas = sp.ligas.filter((x) => x !== liga);
          liga.seccionId = null;
          otro.ligas.push(liga);
          brindis(`Movida a ${otro.nombre}`);
        } else if (dest.tipo === 'seccion') {
          reubicarLiga(sp, liga, dest.id, null, false);
        } else if (dest.tipo === 'sueltas') {
          reubicarLiga(sp, liga, null, null, false);
        } else {
          const ref = sp.ligas.find((x) => x.id === dest.id);
          if (ref) reubicarLiga(sp, liga, ref.seccionId || null, ref.id, dest.tipo === 'despues');
        }
      }
    } else {
      const sec = sp.secciones.find((x) => x.id === arr.id);
      const tieneHijas = sp.secciones.some((x) => x.parentId === arr.id);
      if (sec && dest) {
        if (dest.tipo === 'anidar') {
          const madre = sp.secciones.find((x) => x.id === dest.id);
          if (tieneHijas) brindis('Una sección con subsecciones no puede anidarse');
          else if (madre && madre.parentId) brindis('Solo hay un nivel de subsecciones');
          else if (madre) reubicarSeccion(sp, sec, madre.id, null, false);
        } else {
          const ref = sp.secciones.find((x) => x.id === dest.id);
          if (ref) {
            if (tieneHijas && ref.parentId) brindis('Una sección con subsecciones no puede anidarse');
            else reubicarSeccion(sp, sec, ref.parentId || null, ref.id, dest.tipo === 'despues');
          }
        }
      }
    }

    await guardar();
    pintar();
  }

  function terminar(cancelado) {
    if (rueda) { cancelAnimationFrame(rueda); rueda = null; }
    velocidad = 0;
    if (bloqueo) { document.removeEventListener('touchmove', bloqueo, { passive: false }); bloqueo = null; }
    limpiar();
    vivo.fantasma.remove();
    vivo.nodo.classList.remove('levantada');
    const habia = vivo;
    const donde = destino;
    vivo = null;
    destino = null;
    // Tras soltar llega un click de regalo sobre el enlace: lo tiramos.
    ignorarClick = true;
    setTimeout(() => { ignorarClick = false; }, 400);
    if (!cancelado) soltar(habia, donde);
  }

  /* ------------------------------------------------------------- gestos */
  document.addEventListener('pointerdown', (ev) => {
    if (vivo) return;
    if (!$('#hoja').hidden) return;         // con una hoja abierta, no
    if (filtro) return;                     // en resultados de búsqueda no hay orden que tocar
    if (ev.button != null && ev.button > 0) return;
    if (ev.target.closest('.liga-mas, .sec-act, .icon-btn, .foot-btn, .liga-nota, .sec-nota, input, button.rail-add')) return;

    const liga = ev.target.closest('.liga[data-liga]');
    const cab = ev.target.closest('.sec-head[data-sec-head]');
    if (!liga && !cab) return;

    salida = liga
      ? { x: ev.clientX, y: ev.clientY, tipo: 'liga', id: liga.dataset.liga, nodo: liga }
      : { x: ev.clientX, y: ev.clientY, tipo: 'seccion', id: cab.dataset.secHead, nodo: cab };

    espera = setTimeout(() => { espera = null; if (salida) levantar(salida.x, salida.y); }, ESPERA);
  }, true);

  document.addEventListener('pointermove', (ev) => {
    if (salida) {
      // Se movió antes de tiempo: era un deslizamiento, lo dejamos en paz.
      if (Math.hypot(ev.clientX - salida.x, ev.clientY - salida.y) > FUGA) cancelarEspera();
      return;
    }
    if (!vivo) return;
    ev.preventDefault();
    mover(ev.clientX, ev.clientY);
  }, { passive: false });

  const fin = (cancelado) => (ev) => {
    if (salida) { cancelarEspera(); return; }
    if (!vivo) return;
    ev.preventDefault();
    terminar(cancelado);
  };
  document.addEventListener('pointerup', fin(false));
  document.addEventListener('pointercancel', fin(true));

  document.addEventListener('click', (ev) => {
    if (!ignorarClick) return;
    ev.preventDefault(); ev.stopPropagation();
  }, true);

  // Si la lista se repinta a media faena (raro, pero pasa), el fantasma se
  // quedaría flotando huérfano.
  window.addEventListener('blur', () => { if (vivo) terminar(true); });
})();

/* ------------------------------------------------------------- arranque */
$('#nuevoEspacio').onclick = () => hojaEspacio(null);
$('#btnEspacio').onclick = () => hojaEspacio(espacio());
$('#btnEspMenu').onclick = menuEspacio;
$('#btnDatos').onclick = hojaDatos;
$('#addLiga').onclick = () => hojaLiga(null);
$('#addSeccion').onclick = () => hojaSeccion(espacio(), null);
for (const b of document.querySelectorAll('.vista')) {
  b.onclick = async () => {
    E.ajustes.vista = b.dataset.vista;
    await guardar(); pintar(); $('#scroll').scrollTop = 0;
  };
}

$('#plegarAncladas').onclick = async () => {
  E.ajustes.ancladasPlegadas = !E.ajustes.ancladasPlegadas;
  await guardar(); pintarAncladas();
};

$('#addAnclada').onclick = () => {
  abrirHoja((card) => {
    card.append(el('h3', null, 'Anclar una liga'));
    const iUrl = entrada('', 'https://…', 'url');
    const iTit = entrada('', 'Nombre corto');
    card.append(campo('Dirección', iUrl), campo('Nombre', iTit));
    iUrl.onblur = () => { if (!iTit.value.trim()) iTit.value = etiqueta(normalizarUrl(iUrl.value)) || ''; };
    botones(card, 'Anclar', async () => {
      const url = normalizarUrl(iUrl.value);
      if (!esLanzable(url)) return brindis('Esa dirección no se puede abrir');
      E.ancladas.push({ id: uid(), url, titulo: iTit.value.trim() || etiqueta(url) });
      await guardar(); cerrarHoja(); pintar();
    });
  });
};

let tecleo = null;
$('#buscar').oninput = (ev) => {
  clearTimeout(tecleo);
  const v = ev.target.value.trim();
  tecleo = setTimeout(() => { filtro = v; pintarCuerpo(); }, 120);
};

/* Si algún día esto se envuelve como PWA con share target, la app llega con
   ?url=…&title=… y el formulario se abre solo con los datos puestos. */
function compartidoEntrante() {
  const p = new URLSearchParams(location.search);
  const url = p.get('url') || p.get('text');
  if (!url) return false;
  const limpio = normalizarUrl(String(url).trim().split(/\s+/).pop());
  if (!esLanzable(limpio)) return false;
  hojaLiga(null);
  const card = $('#hojaCard');
  const inputs = card.querySelectorAll('input');
  inputs[0].value = limpio;
  inputs[1].value = p.get('title') || etiqueta(limpio);
  history.replaceState(null, '', location.pathname);
  return true;
}

(async function arrancar() {
  const guardado = await Almacen.leer();
  E = guardado && Array.isArray(guardado.espacios) ? guardado : estadoVacio();
  activo = E.espacios[0] && E.espacios[0].id;
  pintar();
  compartidoEntrante();
  // Al final y sin bloquear: si no hay carpeta o el permiso caducó, calla.
  pintarAvisoCarpeta();
})();

/* ------------------------------------------------------- instalación
   El service worker es lo que hace que Chrome y Samsung Internet ofrezcan
   instalar de verdad (WebAPK). Brave no firma WebAPKs: allí saldrá un
   acceso directo y el menú Compartir no te verá. Instálalo una vez desde
   Chrome o Samsung Internet y luego úsalo desde donde quieras.

   Sin red o abierto como archivo local no hay worker; no pasa nada, el
   lanzador funciona igual. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* da igual */ });
  });

  // El worker sirve la copia guardada para que esto abra al instante, y
  // comprueba las novedades después. Cuando encuentra una, avisa aquí.
  navigator.serviceWorker.addEventListener('message', (ev) => {
    if (ev.data && ev.data.tipo === 'version-nueva') {
      brindis('Hay una versión nueva: ciérrala y ábrela otra vez');
    }
  });
}

/* Si el navegador ofrece instalar, guardamos la invitación para poder
   lanzarla desde ⚙ en vez de depender de que el usuario encuentre el menú. */
let invitacion = null;
window.addEventListener('beforeinstallprompt', (ev) => {
  ev.preventDefault();
  invitacion = ev;
});
window.addEventListener('appinstalled', () => { invitacion = null; });
</script>
