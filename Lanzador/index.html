<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lanzador — Espacios</title>
<style>
/* ------------------------------------------------------------------ tokens
   Heredados tal cual de sidepanel.css para que el lanzador y la extensión
   se vean como la misma herramienta. Lo único que cambia son las medidas:
   aquí se toca con el dedo, no con el ratón. */
:root {
  color-scheme: dark light;

  --ink:      #141318;
  --surface:  #1c1b22;
  --raised:   #24232c;
  --line:     #2c2b35;
  --text:     #e9e7ee;
  --muted:    #8b8797;
  --faint:    #5d5a68;

  --accent:   #6aa9ff;
  --accent-soft: rgba(106, 169, 255, .14);

  --r-sm: 6px;
  --r-md: 9px;
  --r-lg: 13px;

  --grey:   #9aa0a6;
  --blue:   #6aa9ff;
  --red:    #f2836b;
  --yellow: #e8b84b;
  --green:  #62c08a;
  --pink:   #f07eb0;
  --purple: #b18bf5;
  --cyan:   #55c2d0;
  --orange: #f0954d;

  --riel: 58px;
  --toque: 46px;      /* alto mínimo de cualquier cosa que se toque */
}

@media (prefers-color-scheme: light) {
  :root {
    --ink:     #f4f3f7;
    --surface: #ffffff;
    --raised:  #ecebf1;
    --line:    #e0dee8;
    --text:    #23212b;
    --muted:   #6f6b7c;
    --faint:   #9793a4;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  height: 100%; margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ------------------------------------------------------------------ shell */
.shell { display: flex; height: 100%; }

/* -------------------------------------------------------------- el riel */
.rail {
  width: var(--riel); flex: 0 0 var(--riel);
  background: var(--ink);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); gap: 8px;
  overflow-y: auto; scrollbar-width: none;
}
.rail::-webkit-scrollbar { display: none; }
.rail-list { display: flex; flex-direction: column; gap: 8px; width: 100%; align-items: center; }

/* La firma de Espacios: la barrita que crece a la izquierda del chip activo,
   y el cuadrado que se redondea al activarse. */
.chip {
  position: relative;
  width: 42px; height: 42px;
  border-radius: 12px;
  background: var(--raised);
  display: grid; place-items: center;
  font-size: 20px; line-height: 1;
  transition: border-radius .16s ease, background .16s ease;
  flex: 0 0 auto;
}
.chip::before {
  content: ""; position: absolute; left: -9px; top: 50%;
  width: 3px; height: 0; border-radius: 0 3px 3px 0;
  background: var(--chip); transform: translateY(-50%);
  transition: height .18s cubic-bezier(.2,.8,.2,1);
}
.chip.activo::before { height: 24px; }
.chip.activo { background: color-mix(in srgb, var(--chip) 26%, var(--raised)); border-radius: 15px; }
.chip:active { transform: scale(.94); }
.chip .num {
  position: absolute; bottom: -3px; right: -4px;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--ink); border: 1px solid var(--line);
  font-size: 10px; font-weight: 600; line-height: 15px; color: var(--muted);
  display: grid; place-items: center;
}
.rail-add {
  width: 42px; height: 36px; border-radius: 12px;
  color: var(--faint); font-size: 20px; line-height: 1;
  border: 1px dashed var(--line); flex: 0 0 auto;
}

/* ------------------------------------------------------------- la columna */
.main {
  flex: 1; min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
}
.head { flex: 0 0 auto; padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; gap: 4px; }
.space-btn {
  display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;
  padding: 6px 8px; border-radius: var(--r-md); min-height: var(--toque);
}
.space-btn:active { background: var(--raised); }
.space-icon { font-size: 19px; flex: 0 0 auto; }
.space-name {
  font-weight: 600; font-size: 16px; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.icon-btn {
  width: var(--toque); height: var(--toque); border-radius: var(--r-md);
  color: var(--muted); font-size: 17px; display: grid; place-items: center; flex: 0 0 auto;
}
.icon-btn:active { background: var(--raised); color: var(--text); }

.search-row { margin-top: 6px; }
.search-row input {
  width: 100%; height: 40px; padding: 0 12px;
  background: var(--raised); border: 1px solid transparent; border-radius: var(--r-md);
  color: var(--text);
}
.search-row input::placeholder { color: var(--faint); }
.search-row input:focus { border-color: var(--line); outline: none; }

/* -------------------------------------------------------------- ancladas */
.pins { flex: 0 0 auto; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.pins-head {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.pins-plegar {
  flex: 1; display: flex; align-items: center; gap: 6px;
  min-height: 28px; text-align: left; border-radius: var(--r-sm);
}
.pins-plegar:active { background: var(--raised); }
.pins-flecha { color: var(--faint); font-size: 9px; transition: transform .15s ease; }
.pins.plegadas .pins-flecha { transform: rotate(-90deg); }
.pins.plegadas .pin-row { display: none; }
.pins-cuenta { font-size: 11px; color: var(--faint); }
.label {
  font-size: 10px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--faint); flex: 1;
}
.pin-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pin-row::-webkit-scrollbar { display: none; }
.pin {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: var(--r-md);
  background: var(--raised); display: grid; place-items: center;
  text-decoration: none; color: var(--text);
}
.pin:active { background: color-mix(in srgb, var(--accent) 20%, var(--raised)); }

/* ------------------------------------------------------------- las vistas
   Solo sale cuando hay algo que esconder: si todo lo tuyo lleva estrella,
   un filtro de estrellas es un botón que no hace nada. */
.vistas { display: flex; gap: 5px; margin-top: 7px; }
.vista {
  flex: 1; min-height: 36px; border-radius: var(--r-sm);
  background: var(--raised); color: var(--muted);
  font-size: 12px; font-weight: 500;
  border: 1px solid transparent;
}
.vista.on { background: var(--accent-soft); color: var(--text); border-color: var(--accent); }
.vista .n { color: var(--faint); font-size: 11px; margin-left: 3px; }

/* De paso: vino sin estrella de la computadora. Se distingue sin gritar. */
.liga.de-paso .marca { opacity: .55; }
.liga.de-paso .liga-tit { color: var(--muted); }
.liga-sub .paso { color: var(--faint); font-style: italic; }

/* ---------------------------------------------------------------- notas
   En escritorio la nota se lee pasando el cursor por una barrita. En táctil
   no hay cursor que pasar, así que la nota se lee directamente: una línea
   bajo el título, del color que le pusiste. Tocarla la edita. */
/* Barra recta, no el arco que deja un `inset` dentro de una caja redonda. */
.con-nota { position: relative; }
.con-nota::before {
  content: ""; position: absolute; left: 0; top: 4px; bottom: 4px;
  width: 3px; border-radius: 2px; background: var(--nota);
}
.liga.con-nota { padding-left: 11px; }
.liga-nota, .sec-nota {
  display: block; width: 100%; text-align: left;
  font-size: 11px; line-height: 1.35; color: var(--nota);
  margin-top: 3px; padding: 2px 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sec-nota { position: relative; padding: 3px 4px 7px 13px; }
.sec-nota::before {
  content: ""; position: absolute; left: 2px; top: 2px; bottom: 6px;
  width: 3px; border-radius: 2px; background: var(--nota);
}
.liga-nota:active, .sec-nota:active { opacity: .6; }

/* ------------------------------------------------------------ el contenido */
.scroll {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 6px 10px calc(14px + env(safe-area-inset-bottom));
}

.sec { margin-top: 10px; }
.sec.hija { margin-left: 14px; padding-left: 10px; border-left: 1px solid var(--line); }
.sec-head {
  display: flex; align-items: center; gap: 8px;
  min-height: 36px; padding: 0 4px;
}
.sec-punto { width: 7px; height: 7px; border-radius: 50%; background: var(--sec, var(--faint)); flex: 0 0 auto; }
/* El bloque «Sin sección» solo se presenta cuando hace falta: si va primero
   no hay nada de lo que separarlo, y una cabecera ahí sería ruido. */
.sec-punto.hueco { background: none; box-shadow: inset 0 0 0 1px var(--faint); }

/* Plegada: se va su contenido, se queda su cuenta. La nota no se esconde —
   es lo que te dice qué hay ahí dentro sin tener que abrirla. */
.sec.plegada > .liga, .sec.plegada > .sec { display: none; }
.sec-flecha {
  flex: 0 0 auto; width: 14px; text-align: center;
  color: var(--faint); font-size: 9px; line-height: 1;
  transition: transform .15s ease;
}
.sec.plegada > .sec-head .sec-flecha, .sec-head.sueltas.plegada .sec-flecha { transform: rotate(-90deg); }
.sec-head { cursor: pointer; }
.sec-head:active { background: var(--raised); border-radius: var(--r-sm); }
.sec-head.sueltas .sec-name { font-weight: 500; font-style: italic; }
.sec-name {
  font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sec-n { font-size: 11px; color: var(--faint); }
.sec-act { width: 32px; height: 32px; border-radius: var(--r-sm); color: var(--faint); display: grid; place-items: center; }
.sec-act:active { background: var(--raised); color: var(--text); }

/* La liga. Es un <a> de verdad, no un div con onclick: Android sólo entrega
   la dirección a la app instalada si la navegación sale de un enlace real. */
.liga {
  display: flex; align-items: center; gap: 10px;
  min-height: var(--toque); padding: 5px 6px;
  border-radius: var(--r-md);
  text-decoration: none; color: var(--text);
}
.liga:active { background: var(--raised); }
.marca {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px;
  display: grid; place-items: center;
  font-size: 12px; font-weight: 700; letter-spacing: -.03em;
  background: color-mix(in srgb, var(--marca, var(--faint)) 22%, var(--raised));
  color: var(--marca, var(--muted));
  overflow: hidden;
}
.marca img { width: 100%; height: 100%; object-fit: cover; }
.liga-txt { flex: 1; min-width: 0; }
.liga-tit {
  font-size: 14px; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.liga-sub {
  font-size: 11px; color: var(--faint); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.liga-sub .app { color: var(--muted); }
.liga-mas {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: var(--r-sm);
  color: var(--faint); display: grid; place-items: center; font-size: 16px;
}
.liga-mas:active { background: var(--ink); }

.vacio {
  margin: 26px 8px; padding: 20px 16px;
  border: 1px dashed var(--line); border-radius: var(--r-lg);
  color: var(--muted); text-align: center;
}
.vacio h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--text); }
.vacio p { margin: 0 0 14px; font-size: 13px; line-height: 1.5; }

/* ------------------------------------------------------------------- pie */
.foot {
  flex: 0 0 auto; display: flex; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--surface);
}
.foot-btn {
  flex: 1; min-height: var(--toque); border-radius: var(--r-md);
  background: var(--raised); color: var(--text); font-size: 13px; font-weight: 500;
}
.foot-btn:active { background: color-mix(in srgb, var(--accent) 18%, var(--raised)); }
.foot-btn.primaria { background: color-mix(in srgb, var(--accent) 24%, var(--raised)); }

/* --------------------------------------------------------------- arrastre
   En escritorio el arrastre empieza al pinchar. En táctil eso chocaría con
   el desplazamiento, así que hay que mantener pulsado: mientras no pase el
   tiempo de espera, el dedo sigue sirviendo para deslizar la lista. */
.liga, .sec-head {
  -webkit-touch-callout: none;
  user-select: none; -webkit-user-select: none;
}
.levantada { opacity: .3; }

/* El fantasma que sigue al dedo. */
.fantasma {
  position: fixed; z-index: 90; pointer-events: none;
  left: 0; top: 0;
  background: var(--raised);
  border: 1px solid color-mix(in srgb, var(--text) 16%, var(--line));
  border-radius: var(--r-md);
  box-shadow: 0 12px 28px rgba(0,0,0,.45);
  opacity: .95;
}
.fantasma * { pointer-events: none; }

/* La raya de inserción. Va en el hueco, no encima del elemento, para que se
   vea dónde va a caer y no qué se está tocando. */
.suelta-antes, .suelta-despues { position: relative; }
.suelta-antes::before, .suelta-despues::after {
  content: ""; position: absolute; left: 4px; right: 4px; height: 2px;
  background: var(--accent); border-radius: 2px;
}
.suelta-antes::before { top: -2px; }
.suelta-despues::after { bottom: -2px; }

/* Caer dentro: la sección entera se ilumina. */
.suelta-dentro {
  background: var(--accent-soft);
  border-radius: var(--r-md);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.chip.recibe { box-shadow: 0 0 0 2px var(--accent); }

/* ------------------------------------------------------------------ hojas
   En escritorio Espacios usa una tarjeta centrada. En táctil manda la hoja
   que sube desde abajo: el pulgar llega. Las opciones van agrupadas en una
   tarjeta hundida, para que se lean como una lista y no como botones sueltos. */
.hoja {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(8,7,12,.62);
  backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fundir .16s ease;
}
@keyframes fundir { from { opacity: 0; } }
.hoja-card {
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  background: var(--surface);
  border-top: 1px solid color-mix(in srgb, var(--text) 12%, var(--line));
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 -14px 40px rgba(0,0,0,.4);
  animation: subir .22s cubic-bezier(.2,.9,.2,1);
}
@keyframes subir { from { transform: translateY(22px); } }
.asa { width: 40px; height: 4px; border-radius: 2px; background: var(--faint); opacity: .5; margin: 4px auto 14px; }

/* Cabecera: quién es esto. La marca de color repite la de la lista, así
   sabes sobre qué liga estás actuando sin leer. */
.hoja-cab { display: flex; align-items: center; gap: 12px; margin: 0 2px 14px; }
.hoja-cab .marca { width: 38px; height: 38px; border-radius: 11px; font-size: 14px; }
.hoja-cab-txt { min-width: 0; flex: 1; }
.hoja-tit {
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hoja-sub {
  font-size: 12px; color: var(--faint); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hoja h3 { margin: 0 2px 14px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }

.campo { display: block; margin-bottom: 14px; }
.campo > span {
  display: block; font-size: 11px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 6px;
}
.campo input, .campo select, .campo textarea {
  width: 100%; min-height: var(--toque); padding: 11px 13px;
  background: var(--ink); border: 1px solid var(--line); border-radius: 11px;
  color: var(--text);
}
.campo input:focus, .campo select:focus, .campo textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.campo textarea { min-height: 76px; resize: vertical; font-size: 13px; }
.fila { display: flex; gap: 10px; }
.fila > * { flex: 1; min-width: 0; }

.acciones { display: flex; gap: 10px; margin-top: 18px; }
.acciones button {
  flex: 1; min-height: 50px; border-radius: 13px;
  background: var(--raised); font-size: 15px; font-weight: 500;
}
.acciones .ok { background: var(--accent); color: #16151b; font-weight: 600; }
.acciones .ok:active { filter: brightness(.92); }
.acciones .mal { color: var(--red); }

/* Lista de opciones agrupada */
.grupo {
  background: var(--ink); border-radius: 14px; overflow: hidden;
  margin-bottom: 10px;
}
.op {
  display: flex; align-items: center; gap: 13px;
  min-height: 52px; padding: 8px 12px; text-align: left; width: 100%;
  font-size: 15px; color: inherit; text-decoration: none;
}
.op + .op { border-top: 1px solid var(--surface); }
.op:active { background: var(--raised); }
.op .ic {
  width: 32px; height: 32px; flex: 0 0 auto;
  border-radius: 9px; background: var(--raised); color: var(--muted);
  display: grid; place-items: center; font-size: 15px;
}
.op .txt { flex: 1; min-width: 0; }
.op .txt small { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }
.op.mal { color: var(--red); }
.op.mal .ic { color: var(--red); background: color-mix(in srgb, var(--red) 16%, var(--raised)); }
.op.destacada .ic { color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--raised)); }

.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 7px; }
.rejilla button {
  height: 46px; border-radius: 12px; background: var(--ink);
  font-size: 21px; display: grid; place-items: center;
  border: 1px solid transparent;
}
.rejilla button.sel { background: var(--accent-soft); border-color: var(--accent); }
.colores { display: flex; gap: 10px; flex-wrap: wrap; }
.colores button {
  width: 36px; height: 36px; border-radius: 50%; background: var(--c);
  border: 2px solid transparent; background-clip: padding-box;
}
.colores button.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }

/* --------------------------------------------------------- importación */
.imp-esp {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 4px; border-bottom: 1px solid var(--line);
}
.imp-esp:last-child { border-bottom: 0; }
.imp-check { width: 24px; height: 24px; flex: 0 0 auto; accent-color: var(--accent); }
.imp-txt { flex: 1; min-width: 0; }
.imp-nom { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.imp-det { font-size: 11px; color: var(--faint); }
.conmutador {
  display: flex; align-items: center; gap: 13px;
  min-height: 52px; padding: 8px 12px;
  background: var(--ink); border-radius: 14px; margin-bottom: 10px;
  font-size: 15px; line-height: 1.3;
}
/* Sin esto, la regla general de .campo input estira la casilla a todo el
   ancho y aplasta el texto de al lado. */
.campo input[type="checkbox"], .imp-check {
  width: 24px; height: 24px; min-height: 0; padding: 0;
  flex: 0 0 auto; accent-color: var(--accent);
}
.imp-esp select { flex: 0 0 auto; max-width: 42%; min-height: 38px; padding: 0 8px;
  background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-sm); font-size: 12px; }

.aviso {
  margin: 10px 0; padding: 10px 12px; border-radius: var(--r-md);
  background: var(--accent-soft); color: var(--text); font-size: 12px; line-height: 1.5;
}

.aviso.pulsable {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left; min-height: var(--toque);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent);
}
.aviso.pulsable:active { filter: brightness(1.15); }
.aviso .ir { margin-left: auto; color: var(--accent); font-weight: 600; flex: 0 0 auto; }

.copia {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 52px; padding: 8px 12px; text-align: left;
  font-size: 14px;
}
.copia + .copia { border-top: 1px solid var(--surface); }
.copia:active { background: var(--raised); }
.copia .cuando { flex: 1; min-width: 0; }
.copia .cuando small { display: block; font-size: 11px; color: var(--faint); margin-top: 1px; }
.copia .insignia {
  flex: 0 0 auto; font-size: 10px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--accent);
}

.pasos { counter-reset: paso; margin: 4px 0 0; padding: 0; list-style: none; }
.pasos li {
  counter-increment: paso; position: relative;
  padding: 0 0 12px 30px; font-size: 13px; line-height: 1.5; color: var(--muted);
}

  content: counter(paso); position: absolute; left: 0; top: 0;
  width: 20px; height: 20px; border-radius: 50%;

}
.pasos code {

}

.brindis {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
  transform: translateX(-50%); z-index: 60;
  background: var(--raised); border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 999px; font-size: 13px;

}

/* En pantalla ancha (la tablet en horizontal, sin dividir) no estiramos las
   ligas a lo bestia: el lanzador está pensado para una columna estrecha. */
@media (min-width: 620px) {
  .scroll > .cuerpo { max-width: 560px; }
}
</style>

<script>
"use strict";

/* ==========================================================================
   Lanzador — prototipo
   --------------------------------------------------------------------------
   Hermano de bolsillo de la extensión Espacios. No gestiona pestañas vivas:
   guarda ligas y las abre. En Android, tocar una liga de Drive abre la app de
   Drive en ese documento; si la app no está, cae al navegador.

   Tres cosas que conviene saber antes de tocar el código:

   1. Las ligas son <a href target="_blank">. Tiene que ser un enlace real y
      la navegación tiene que salir del gesto: si abres con location.href o
      window.open, Android no siempre se lo entrega a la app. Y _blank importa
      porque si NO hay app que atienda la dirección, se abre en pestaña nueva
      y el lanzador sigue en su mitad de la pantalla dividida.

   2. Aquí no se sabe qué hay abierto. Ninguna app deja mirar dentro de otra.
      Lo único que hace el lanzador es lanzar.

   3. El estado se guarda donde se pueda (ver Almacen) pero la copia buena es
      el archivo. Exporta antes de nada raro.
   ========================================================================== */

const COLORES = ['grey','blue','red','yellow','green','pink','purple','cyan','orange'];
const EMOJIS = ['🗂️','💼','🏠','📚','🎓','🧪','💻','🎨','🎬','🎧','📝','📊','🛒','✈️','🍳','🏋️','💰','🧾','📬','🔧','🌱','🐦','⚽','🎮','🧠','🩺','⚖️','🗺️','📷','🔬','🕹️','🧵','☕','🌙','⭐','🔥','🧩','📌'];

/* Direcciones que en Android abren app en vez de navegador. Es sólo una
   etiqueta informativa: quien decide de verdad es el sistema. */
const APPS = [
  [/(^|\.)docs\.google\.com$/,        'Documentos'],
  [/(^|\.)drive\.google\.com$/,       'Drive'],
  [/(^|\.)sheets\.google\.com$/,      'Hojas'],
  [/(^|\.)mail\.google\.com$/,        'Gmail'],
  [/(^|\.)calendar\.google\.com$/,    'Calendario'],
  [/(^|\.)keep\.google\.com$/,        'Keep'],
  [/(^|\.)notion\.so$/,               'Notion'],
  [/(^|\.)youtube\.com$|^youtu\.be$/, 'YouTube'],
  [/(^|\.)open\.spotify\.com$/,       'Spotify'],
  [/(^|\.)wa\.me$|(^|\.)chat\.whatsapp\.com$/, 'WhatsApp'],
  [/(^|\.)t\.me$/,                    'Telegram'],
  [/(^|\.)github\.com$/,              'GitHub'],
  [/(^|\.)figma\.com$/,               'Figma'],
  [/(^|\.)trello\.com$/,              'Trello'],
  [/(^|\.)slack\.com$/,               'Slack'],
  [/(^|\.)linear\.app$/,              'Linear'],
  [/(^|\.)obsidian\.md$/,             'Obsidian'],
  [/(^|\.)dropbox\.com$/,             'Dropbox'],
  [/(^|\.)todoist\.com$/,             'Todoist'],
  [/(^|\.)x\.com$|(^|\.)twitter\.com$/, 'X'],
  [/(^|\.)reddit\.com$/,              'Reddit'],
  [/(^|\.)instagram\.com$/,           'Instagram'],
  [/(^|\.)maps\.google\.com$/,        'Maps']
];

/* -------------------------------------------------------------- utilería */
const $  = (s) => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

function anfitrion(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
}
function appDe(url) {
  const h = anfitrion(url);
  if (!h) return null;
  for (const [re, nombre] of APPS) if (re.test(h)) return nombre;
  return null;
}
/** Lo que se enseña debajo del nombre: el dominio si es web, y si no el
    esquema, que es lo que de verdad decide a dónde va (tg, whatsapp…). */
function etiqueta(url) {
  const s = String(url || '').trim();
  if (/^https?:/i.test(s)) return anfitrion(s);
  const m = s.match(/^([a-z][a-z0-9+.-]*):/i);
  return m ? m[1].toLowerCase() : s;
}
/** Frase honesta sobre qué va a pasar al tocar. */
function destinoDe(url) {
  if (!esLanzable(url)) return '';
  if (!/^https?:/i.test(url)) return 'Va directa a la app, sin pasar por el navegador';
  const app = appDe(url);
  return app ? 'Debería abrir ' + app : 'Se abre en el navegador salvo que alguna app reclame ese dominio';
}
function monograma(url, titulo) {
  const base = etiqueta(url) || titulo || '?';
  return base.split('.')[0].slice(0, 2).toUpperCase();
}
/** Color estable a partir de la dirección: la misma web siempre igual. */
function colorDe(url) {
  const h = etiqueta(url) || String(url || '');
  let n = 0;
  for (let i = 0; i < h.length; i++) n = (n * 31 + h.charCodeAt(i)) >>> 0;
  return COLORES[n % COLORES.length];
}
function normalizarUrl(txt) {
  const s = String(txt || '').trim();
  if (!s) return '';
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return s;      // ya trae esquema
  return 'https://' + s;
}
/* Cualquier esquema vale: además de http(s), las apps traen los suyos
   (whatsapp://, tg://, spotify://, obsidian://). Van directas a la app sin
   pasar por el navegador; si la app no está, el sistema da error en vez de
   caer a la web. Lo único que se descarta es lo que no es una dirección. */
function esLanzable(url) {
  const s = String(url || '').trim();
  if (/^(javascript|data|blob|file):/i.test(s)) return false;
  return /^[a-z][a-z0-9+.-]*:/i.test(s);
}

/* -------------------------------------------------------------- almacén
   Tres pisos, de mejor a peor:
     1. window.storage  — cuando esto corre dentro de Claude.
     2. localStorage    — cuando lo guardas como archivo y lo abres en Brave.
     3. memoria         — último recurso; se pierde al cerrar, y se avisa.
   Se elige uno al arrancar y no se mezclan. */
const Almacen = (() => {
  const CLAVE = 'lanzador:estado';
  let modo = 'memoria';
  let mem = null;

  if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') {
    modo = 'artefacto';
  } else {
    try {
      const p = '__lanzador_probe__';
      window.localStorage.setItem(p, '1');
      window.localStorage.removeItem(p);
      modo = 'local';
    } catch { modo = 'memoria'; }
  }

  return {
    modo,
    async leer() {
      try {
        if (modo === 'artefacto') {
          const r = await window.storage.get(CLAVE, false);
          return r && r.value ? JSON.parse(r.value) : null;
        }
        if (modo === 'local') {
          const s = window.localStorage.getItem(CLAVE);
          return s ? JSON.parse(s) : null;
        }
      } catch { return null; }
      return mem;
    },
    /** Devuelve true si quedó guardado de verdad, false si solo en memoria. */
    async escribir(estado) {
      const s = JSON.stringify(estado);
      try {
        if (modo === 'artefacto') { await window.storage.set(CLAVE, s, false); return true; }
        if (modo === 'local') { window.localStorage.setItem(CLAVE, s); return true; }
      } catch { /* se cae a memoria abajo */ }
      mem = JSON.parse(s);
      return false;
    }
  };
})();

/* -------------------------------------------------------------- carpeta
   Eliges una carpeta del dispositivo —la que sincronices con Drive, OneDrive
   o Syncthing— y el lanzador lee de ahí las copias que escribe la extensión.

   Lee y escribe, pero NUNCA borra ni pisa: cada copia es un archivo nuevo
   con la fecha en el nombre, `espacios-AAAA-MM-DD-HHMMSS.json`. Por eso esto
   no puede liarla — no es un sincronizador. Si guardas desde la tablet y
   desde la computadora acabas con dos archivos distintos, que es justo lo
   que quieres poder comparar. Y como el nombre es la fecha, ordenar por
   nombre es ordenar por fecha.

   La extensión sí limpia: deja las diez últimas cada vez que guarda. Aquí no
   se borra nada, para no arriesgarse a tirar la única copia buena de la otra
   máquina por una cuenta mal hecha.

   Dos cosas que impone el navegador y conviene saber:

     · Elegir carpeta solo vale desde un toque tuyo. No se puede automatizar.
     · El permiso puede caducar al cerrar. La carpeta elegida no se pierde
       (vive en IndexedDB, el único sitio donde cabe una referencia así), pero
       puede hacer falta volver a concederlo, y eso también pide un toque.

   Por eso el repaso automático al abrir solo ocurre si el permiso SIGUE
   concedido; si no, el lanzador se calla y espera a que entres a la pantalla
   de la carpeta. Nada de ventanas saltando sin que las pidas. */
const Carpeta = (() => {
  const BD = 'lanzador-carpeta';
  const ALMACEN = 'carpetas';
  const CLAVE = 'copias';
  const PATRON = /^espacios-(\d{4})-(\d{2})-(\d{2})-(\d{4})(\d{2})?\.json$/;
  const hayApi = () => typeof window.showDirectoryPicker === 'function';

  function conBD(modo, fn) {
    return new Promise((ok, mal) => {
      let pet;
      try { pet = indexedDB.open(BD, 1); } catch (e) { return mal(e); }
      pet.onupgradeneeded = () => { pet.result.createObjectStore(ALMACEN); };
      pet.onerror = () => mal(pet.error);
      pet.onsuccess = () => {
        const bd = pet.result;
        const tx = bd.transaction(ALMACEN, modo);
        const p = fn(tx.objectStore(ALMACEN));
        tx.oncomplete = () => { bd.close(); ok(p?.result); };
        tx.onerror = () => { bd.close(); mal(tx.error); };
      };
    });
  }

  const recordar = (h) => conBD('readwrite', (st) => st.put(h, CLAVE));
  const recordada = () => conBD('readonly', (st) => st.get(CLAVE)).catch(() => null);
  const olvidar = () => conBD('readwrite', (st) => st.delete(CLAVE)).catch(() => null);

  async function elegir() {
    // El mismo `id` que usa la extensión: el navegador recuerda dónde
    // estabas y el selector abre en la carpeta de siempre.
    const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'espacios-copias' });
    await recordar(h);
    return h;
  }

  /**
   * ¿Se puede ahora? Con `pedir`, saca el aviso del navegador; sin él, solo
   * mira. Pedirlo exige un toque tuyo reciente, así que va dentro del
   * manejador del clic y nunca en el repaso automático.
   *
   * Un permiso de escritura vale también para leer, así que para leer se
   * pregunta por 'read' a secas y no se molesta a nadie de más.
   */
  async function permiso(h, pedir = false, modo = 'read') {
    if (!h) return false;
    const op = { mode: modo };
    try {
      if ((await h.queryPermission?.(op)) === 'granted') return true;
      if (!pedir) return false;
      return (await h.requestPermission?.(op)) === 'granted';
    } catch { return false; }
  }

  /** ¿Este navegador deja escribir, además de elegir carpeta? */
  const sabeEscribir = () => typeof FileSystemFileHandle !== 'undefined'
    && typeof FileSystemFileHandle.prototype.createWritable === 'function';

  /**
   * Escribe una copia nueva. No toca ninguna que ya exista: el nombre lleva
   * hasta los segundos, así que dos guardados nunca chocan.
   */
  async function guardar(h, datos, nombre) {
    const archivo = await h.getFileHandle(nombre, { create: true });
    const chorro = await archivo.createWritable();
    await chorro.write(JSON.stringify(datos, null, 2));
    await chorro.close();
    return nombre;
  }

  function fechaDelNombre(nombre) {
    const m = PATRON.exec(nombre || '');
    if (!m) return null;
    const [, a, mes, d, hm, seg] = m;
    const f = new Date(Number(a), Number(mes) - 1, Number(d),
                       Number(hm.slice(0, 2)), Number(hm.slice(2)), Number(seg || 0));
    return isNaN(f.getTime()) ? null : f;
  }

  /** Las copias de la carpeta, de la más reciente a la más vieja. */
  async function listar(h) {
    const copias = [];
    if (!h?.values) return copias;
    for await (const entrada of h.values()) {
      if (entrada.kind !== 'file') continue;
      const f = fechaDelNombre(entrada.name);
      if (f) copias.push({ nombre: entrada.name, ts: f.getTime() });
    }
    return copias.sort((a, b) => b.ts - a.ts);
  }

  /** Lee una copia por su nombre; sin nombre, la más reciente. */
  async function leer(h, nombre = null) {
    let cual = nombre;
    if (!cual) {
      const [ultima] = await listar(h);
      if (!ultima) return null;
      cual = ultima.nombre;
    }
    const archivo = await h.getFileHandle(cual);
    const texto = await (await archivo.getFile()).text();
    return { nombre: cual, ts: fechaDelNombre(cual)?.getTime() || 0, datos: JSON.parse(texto) };
  }

  return { hayApi, sabeEscribir, elegir, recordar, recordada, olvidar, permiso,
           listar, leer, guardar, fechaDelNombre };
})();

/** "hace 3 horas", "hace 2 días". Para no hacer leer una fecha completa. */
function hace(ts) {
  const seg = Math.max(0, (Date.now() - ts) / 1000);
  if (seg < 90) return 'ahora mismo';
  const min = seg / 60;
  if (min < 60) return `hace ${Math.round(min)} min`;
  const hor = min / 60;
  if (hor < 24) return `hace ${Math.round(hor)} h`;
  const dia = Math.round(hor / 24);
  return dia === 1 ? 'ayer' : `hace ${dia} días`;
}

/* --------------------------------------------------------------- estado */
let E = null;              // el estado del lanzador
let activo = null;         // id del espacio en pantalla
let filtro = '';

function estadoVacio() {
  return {
    app: 'lanzador', v: 1,
    espacios: [{ id: uid(), nombre: 'General', icono: '🗂️', color: 'blue',
                 secciones: [], ligas: [], notas: {}, orden: ['__none__'] }],
    ancladas: [],
    ajustes: {}
  };
}

function espacio() { return E.espacios.find((s) => s.id === activo) || E.espacios[0] || null; }

/* ------------------------------------------------- el orden de ahí arriba
   `orden` es la lista de lo que va en el primer nivel, con las mismas piezas
   que usa la extensión:

     · el id de una sección raíz
     · `l:<liga>` para una liga suelta colocada en un sitio concreto
       (allá es `t:<pestaña>`; se traduce al entrar y al salir)
     · `__none__`, que es EL BLOQUE «Sin sección»

   `__none__` importa más de lo que parece: no es un hueco, es un sitio. En la
   extensión puedes ponerlo donde quieras —arriba, abajo, entre dos secciones—
   y antes aquí no existía: el lanzador dibujaba las sueltas arriba del todo y
   al exportar las escribía como `l:` una por una. Eso llegaba a la extensión
   como «cada suelta clavada arriba», el bloque se quedaba sin nada que
   enseñar y desaparecía. Perdía tu orden y encima parecía que borraba cosas.

   Esto es el `topKeys()` de la extensión, portado tal cual para que las dos
   lean la lista igual. */
function ordenTop(sp) {
  const raices = sp.secciones.filter((x) => !x.parentId).map((x) => x.id);
  const sueltas = new Set(sp.ligas.filter((l) => !l.seccionId).map((l) => l.id));
  const salvado = (Array.isArray(sp.orden) ? sp.orden : []).filter((k) => {
    if (k === '__none__') return true;
    if (String(k).startsWith('l:')) return sueltas.has(String(k).slice(2));
    return raices.includes(k);
  });
  for (const k of raices) if (!salvado.includes(k)) salvado.push(k);
  if (!salvado.includes('__none__')) salvado.push('__none__');
  return salvado;
}

/* --------------------------------------------------------------- vistas
   `★` enseña lo tuyo de siempre; `De paso` lo que bajó sin estrella de la
   computadora, que es justo lo que quieres poder rebuscar cuando no te
   acuerdas de dónde salió aquel archivo. */
const vistaActual = () => (E.ajustes?.vista === 'estrella' || E.ajustes?.vista === 'paso')
  ? E.ajustes.vista : 'todo';

function enLaVista(l, vista = vistaActual()) {
  if (vista === 'estrella') return l.estrella !== false;
  if (vista === 'paso') return l.estrella === false;
  return true;
}

/** Las de este espacio que pasan el filtro de ahora. */
const ligasVisibles = (sp) => sp.ligas.filter((l) => enLaVista(l));

async function guardar() {
  // El aviso salía al revés: `escribir` devuelve si GUARDÓ, y aquí se leía
  // como si devolviera lo contrario, así que el cartel de «no hay dónde
  // guardar» aparecía justo cuando sí lo había.
  const guardado = await Almacen.escribir(E);
  if (!guardado && !guardar.avisado) {
    guardar.avisado = true;
    brindis('Sin sitio donde guardar: exporta antes de cerrar');
  }
}

/** Saneamiento: nunca dos ligas con el mismo id, ni ligas huérfanas de
    sección. Es el mismo problema de "una pestaña, un registro" de Espacios,
    en pequeño. */
function sanear() {
  if (!E || !Array.isArray(E.espacios)) E = estadoVacio();
  if (!Array.isArray(E.ancladas)) E.ancladas = [];
  const vistos = new Set();
  for (const sp of E.espacios) {
    sp.id ||= uid();
    sp.nombre = String(sp.nombre || 'Espacio');
    sp.icono ||= '🗂️';
    sp.color = COLORES.includes(sp.color) ? sp.color : 'blue';
    sp.secciones = Array.isArray(sp.secciones) ? sp.secciones : [];
    sp.ligas = Array.isArray(sp.ligas) ? sp.ligas : [];
    // Espacios guardados antes de que existieran las notas.
    if (!sp.notas || typeof sp.notas !== 'object') sp.notas = {};
    const ids = new Set(sp.secciones.map((x) => x.id));
    for (const sec of sp.secciones) {
      sec.id ||= uid();
      sec.nombre = String(sec.nombre || 'Sección');
      if (sec.parentId && !ids.has(sec.parentId)) sec.parentId = null;
      if (sec.parentId === sec.id) sec.parentId = null;
    }
    sp.ligas = sp.ligas.filter((l) => l && esLanzable(l.url));
    for (const l of sp.ligas) {
      if (!l.id || vistos.has(l.id)) l.id = uid();
      vistos.add(l.id);
      l.titulo = String(l.titulo || etiqueta(l.url) || l.url);
      if (l.seccionId && !ids.has(l.seccionId)) l.seccionId = null;
      // La estrella. Lo que crees aquí la lleva; lo que venga de paso, no.
      // Sin `=== false` lo guardado antes de que esto existiera perdería
      // la estrella entera al primer arranque.
      l.estrella = l.estrella !== false;
    }
  }
  // El orden de arriba, sin llaves muertas y con lo nuevo al final.
  for (const sp of E.espacios) sp.orden = ordenTop(sp);

  // Notas huérfanas: lo anotado sobre algo que ya no existe no tiene dueño.
  for (const sp of E.espacios) {
    const vivos = new Set([
      ...sp.ligas.map((l) => 'l:' + l.id),
      ...sp.secciones.map((x) => 's:' + x.id)
    ]);
    for (const k of Object.keys(sp.notas)) {
      const n = sp.notas[k];
      if (!vivos.has(k) || !n || !String(n.texto || '').trim()) delete sp.notas[k];
      else sp.notas[k] = {
        texto: String(n.texto),
        color: COLORES.includes(n.color) ? n.color : 'yellow',
        actualizado: n.actualizado || Date.now()
      };
    }
  }
  if (!E.ajustes || typeof E.ajustes !== 'object') E.ajustes = {};
  E.ancladas = E.ancladas.filter((a) => a && esLanzable(a.url));
  for (const a of E.ancladas) { a.id ||= uid(); a.titulo = String(a.titulo || etiqueta(a.url)); }
  if (!E.espacios.length) E.espacios = estadoVacio().espacios;
  if (!E.espacios.some((s) => s.id === activo)) activo = E.espacios[0].id;
}

/* --------------------------------------------------------------- pintar */
function pintar() {
  sanear();
  pintarRiel();
  pintarCabecera();
  pintarVistas();
  pintarAncladas();
  pintarCuerpo();
}

function pintarRiel() {
  const cont = $('#rielLista');
  cont.textContent = '';
  for (const sp of E.espacios) {
    const b = el('button', 'chip' + (sp.id === activo ? ' activo' : ''));
    b.dataset.espacio = sp.id;
    b.style.setProperty('--chip', `var(--${sp.color})`);
    b.title = sp.nombre;
    b.setAttribute('aria-label', sp.nombre);
    b.append(document.createTextNode(sp.icono));
    if (sp.ligas.length) b.append(el('span', 'num', String(sp.ligas.length)));
    b.onclick = () => { activo = sp.id; filtro = ''; $('#buscar').value = ''; pintar(); $('#scroll').scrollTop = 0; };
    cont.append(b);
  }
}

function pintarCabecera() {
  const sp = espacio();
  $('#espIcono').textContent = sp.icono;
  $('#espNombre').textContent = sp.nombre;
  document.documentElement.style.setProperty('--accent', `var(--${sp.color})`);
}

function pintarVistas() {
  const caja = $('#vistas');
  const sp = espacio();
  const conEstrella = sp.ligas.filter((l) => l.estrella !== false).length;
  const dePaso = sp.ligas.length - conEstrella;

  // Sin nada de paso no hay nada que filtrar: la tira sobra.
  caja.hidden = dePaso === 0;
  if (caja.hidden) { if (E.ajustes.vista) delete E.ajustes.vista; return; }

  $('#nTodo').textContent = sp.ligas.length;
  $('#nEstrella').textContent = conEstrella;
  $('#nPaso').textContent = dePaso;
  const v = vistaActual();
  for (const b of caja.querySelectorAll('.vista')) b.classList.toggle('on', b.dataset.vista === v);
}

function pintarAncladas() {
  const caja = $('#ancladas');
  const fila = $('#filaAncladas');
  fila.textContent = '';
  caja.hidden = false;

  const plegadas = !!E.ajustes.ancladasPlegadas;
  caja.classList.toggle('plegadas', plegadas);
  $('#plegarAncladas').setAttribute('aria-expanded', String(!plegadas));
  $('#cuentaAncladas').textContent = plegadas && E.ancladas.length ? String(E.ancladas.length) : '';
  for (const a of E.ancladas) {
    const link = el('a', 'pin');
    link.href = a.url; link.target = '_blank'; link.rel = 'noopener';
    link.title = a.titulo;
    const m = el('div', 'marca', monograma(a.url, a.titulo));
    m.style.setProperty('--marca', `var(--${colorDe(a.url)})`);
    link.append(m);
    link.oncontextmenu = (ev) => { ev.preventDefault(); menuAnclada(a); };
    fila.append(link);
  }
  if (!E.ancladas.length) {
    const p = el('div', 'imp-det', 'Las ligas que uses en todos los espacios van aquí.');
    fila.append(p);
  }
}

/* ------------------------------------------------------------------ notas
   Viven en el espacio, bajo la clave `l:<liga>` o `s:<sección>`, igual que en
   la extensión (que usa `t:` para sus pestañas). Así viajan en el archivo de
   exportación y el importador las trae con su dueño. */
const claveNota = (tipo, id) => `${tipo}:${id}`;
const notaDe = (sp, tipo, id) => (sp?.notas || {})[claveNota(tipo, id)] || null;

/** La línea de nota que se lee sin tocar nada. Tocarla la edita. */
function nodoNota(sp, tipo, id, nota, clase) {
  const n = el('button', clase, nota.texto.replace(/\s+/g, ' ').trim());
  n.type = 'button';
  n.style.setProperty('--nota', `var(--${nota.color})`);
  n.title = nota.texto;
  n.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); hojaNota(sp, tipo, id); };
  return n;
}

function nodoLiga(l) {
  const link = el('a', 'liga' + (l.estrella === false ? ' de-paso' : ''));
  link.href = l.url; link.target = '_blank'; link.rel = 'noopener';
  link.dataset.liga = l.id;

  const m = el('div', 'marca');
  m.style.setProperty('--marca', `var(--${colorDe(l.url)})`);
  if (E.ajustes && E.ajustes.favicons) {
    const img = el('img');
    // El que vino en el archivo, si lo hay: así no hay que pedírselo a nadie.
    img.src = l.favicon || ('https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(anfitrion(l.url)));
    img.alt = ''; img.loading = 'lazy';
    img.onerror = () => { img.remove(); m.textContent = monograma(l.url, l.titulo); };
    m.append(img);
  } else {
    m.textContent = monograma(l.url, l.titulo);
  }

  const txt = el('div', 'liga-txt');
  txt.append(el('div', 'liga-tit', l.titulo));
  const sub = el('div', 'liga-sub');
  const app = appDe(l.url);
  if (app) { const s = el('span', 'app', 'Abre en ' + app); sub.append(s, document.createTextNode(' · ' + anfitrion(l.url))); }
  else if (!/^https?:/i.test(l.url)) { sub.append(el('span', 'app', 'Directa a la app'), document.createTextNode(' · ' + etiqueta(l.url))); }
  else sub.textContent = etiqueta(l.url) || l.url;
  if (l.estrella === false) sub.append(document.createTextNode(' · '), el('span', 'paso', 'de paso'));
  txt.append(sub);

  const nota = notaDe(espacio(), 'l', l.id);
  if (nota) {
    link.classList.add('con-nota');
    link.style.setProperty('--nota', `var(--${nota.color})`);
    txt.append(nodoNota(espacio(), 'l', l.id, nota, 'liga-nota'));
  }

  const mas = el('button', 'liga-mas', '⋯');
  mas.setAttribute('aria-label', 'Opciones de ' + l.titulo);
  mas.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); menuLiga(l); };

  link.append(m, txt, mas);
  // El menú vive en el botón ⋯: mantener pulsado ahora significa arrastrar.
  link.oncontextmenu = (ev) => ev.preventDefault();
  return link;
}

/**
 * Plegar una sección.
 *
 * Arrastra a sus subsecciones, como en la extensión: allá una sección es un
 * grupo de pestañas de verdad y plegar el grupo padre pliega los suyos, así
 * que si aquí no se hiciera igual, el archivo volvería diciendo otra cosa.
 */
async function plegarSeccion(sp, sec) {
  const valor = !sec.plegada;
  sec.plegada = valor;
  for (const h of sp.secciones) if (h.parentId === sec.id) h.plegada = valor;
  await guardar(); pintar();
}

/** El bloque de sueltas no es una sección, así que su plegado se queda aquí
 *  y no viaja en el archivo. En la extensión también es cosa del panel. */
async function plegarSueltas(sp) {
  const m = E.ajustes.sueltasPlegadas || (E.ajustes.sueltasPlegadas = {});
  if (m[sp.id]) delete m[sp.id]; else m[sp.id] = true;
  await guardar(); pintar();
}

function pintarCuerpo() {
  const cuerpo = $('#cuerpo');
  cuerpo.textContent = '';

  if (filtro) return pintarBusqueda(cuerpo);

  const sp = espacio();
  if (!sp.ligas.length && !sp.secciones.length) return pintarVacio(cuerpo);

  const visibles = ligasVisibles(sp);
  if (!visibles.length && sp.ligas.length) {
    const v = el('div', 'vacio');
    v.append(el('h2', null, vistaActual() === 'paso' ? 'Nada de paso aquí' : 'Nada con estrella aquí'));
    v.append(el('p', null, 'Toca «Todo» arriba para ver el resto.'));
    cuerpo.append(v);
    return;
  }

  // El primer nivel va en el orden que diga `orden`, y ahí dentro el bloque
  // «Sin sección» ocupa su sitio como una sección más.
  const clavadas = new Set(sp.orden.filter((k) => String(k).startsWith('l:')).map((k) => k.slice(2)));
  for (const key of sp.orden) {
    if (String(key).startsWith('l:')) {
      const l = sp.ligas.find((x) => x.id === key.slice(2));
      if (l && !l.seccionId && enLaVista(l)) cuerpo.append(nodoLiga(l));
      continue;
    }
    if (key === '__none__') {
      const bloque = visibles.filter((l) => !l.seccionId && !clavadas.has(l.id));
      if (!bloque.length) continue;
      // Si el bloque va detrás de una sección, se presenta: sin cabecera,
      // sus ligas parecerían la cola de la sección de arriba. Y con cabecera
      // también se puede plegar; sin ella no habría dónde tocar.
      const conCabecera = sp.orden.indexOf('__none__') > 0 && sp.secciones.some((x) => !x.parentId);
      const plegado = conCabecera && !!(E.ajustes.sueltasPlegadas || {})[sp.id];
      if (conCabecera) {
        const cab = el('div', 'sec-head sueltas' + (plegado ? ' plegada' : ''));
        cab.append(el('span', 'sec-flecha', '▼'),
                   el('span', 'sec-punto hueco'),
                   el('span', 'sec-name', 'Sin sección'),
                   el('span', 'sec-n', String(bloque.length)));
        cab.setAttribute('aria-expanded', String(!plegado));
        cab.onclick = () => plegarSueltas(sp);
        cuerpo.append(cab);
      }
      if (!plegado) for (const l of bloque) cuerpo.append(nodoLiga(l));
      continue;
    }
    const sec = sp.secciones.find((x) => x.id === key);
    if (sec) cuerpo.append(nodoSeccion(sp, sec, false));
  }
}

function nodoSeccion(sp, sec, hija) {
  const caja = el('div', 'sec' + (hija ? ' hija' : '') + (sec.plegada ? ' plegada' : ''));
  caja.dataset.sec = sec.id;
  const cab = el('div', 'sec-head');
  cab.dataset.secHead = sec.id;
  cab.oncontextmenu = (ev) => ev.preventDefault();
  const flecha = el('span', 'sec-flecha', '▼');
  const punto = el('span', 'sec-punto');
  punto.style.setProperty('--sec', `var(--${COLORES.includes(sec.color) ? sec.color : 'grey'})`);
  const dentro = sp.ligas.filter((l) => l.seccionId === sec.id && enLaVista(l));
  const mas = el('button', 'sec-act', '⋯');
  mas.setAttribute('aria-label', 'Opciones de ' + sec.nombre);
  // Sin esto, tocar el menú plegaría la sección de paso.
  mas.onclick = (ev) => { ev.stopPropagation(); menuSeccion(sp, sec); };

  // Plegada, la cuenta incluye lo que hay en sus subsecciones: si no, una
  // sección llena de subsecciones se vería como si estuviera vacía.
  const hijas = sp.secciones.filter((x) => x.parentId === sec.id);
  const bajo = new Set([sec.id, ...hijas.map((x) => x.id)]);
  const total = sp.ligas.filter((l) => bajo.has(l.seccionId) && enLaVista(l)).length;

  cab.append(flecha, punto, el('span', 'sec-name', sec.nombre),
             el('span', 'sec-n', String(sec.plegada ? total : dentro.length)), mas);
  cab.setAttribute('aria-expanded', String(!sec.plegada));
  cab.onclick = () => plegarSeccion(sp, sec);
  caja.append(cab);
  const nota = notaDe(sp, 's', sec.id);
  if (nota) caja.append(nodoNota(sp, 's', sec.id, nota, 'sec-nota'));
  for (const l of dentro) caja.append(nodoLiga(l));
  for (const h of hijas) caja.append(nodoSeccion(sp, h, true));
  return caja;
}

function pintarBusqueda(cuerpo) {
  const q = filtro.toLowerCase();
  let n = 0;
  for (const sp of E.espacios) {
    const hits = sp.ligas.filter((l) => enLaVista(l) &&
      (l.titulo.toLowerCase().includes(q) || String(l.url).toLowerCase().includes(q)));
    if (!hits.length) continue;
    n += hits.length;
    const cab = el('div', 'sec-head');
    cab.append(document.createTextNode(sp.icono + ' '), el('span', 'sec-name', sp.nombre), el('span', 'sec-n', String(hits.length)));
    cuerpo.append(cab);
    for (const l of hits) cuerpo.append(nodoLiga(l));
  }
  if (!n) {
    const v = el('div', 'vacio');
    v.append(el('h2', null, 'Ninguna liga coincide'));
    v.append(el('p', null, 'Prueba con parte de la dirección, no sólo del nombre.'));
    cuerpo.append(v);
  }
}

function pintarVacio(cuerpo) {
  const v = el('div', 'vacio');
  v.append(el('h2', null, 'Este espacio está vacío'));
  v.append(el('p', null, 'Trae tus espacios desde el archivo que exporta la extensión, o añade una liga a mano.'));
  const b1 = el('button', 'foot-btn primaria', 'Importar de Espacios');
  b1.onclick = () => hojaImportar();
  const b2 = el('button', 'foot-btn', 'Añadir liga');
  b2.onclick = () => hojaLiga(null);
  const fila = el('div', 'acciones');
  fila.append(b1, b2);
  v.append(fila);
  cuerpo.append(v);
}

/* ----------------------------------------------------------------- hojas */
function abrirHoja(construir) {
  const card = $('#hojaCard');
  card.textContent = '';
  card.append(el('div', 'asa'));
  construir(card);
  $('#hoja').hidden = false;
}
function cerrarHoja() { $('#hoja').hidden = true; $('#hojaCard').textContent = ''; }

$('#hoja').onclick = (ev) => { if (ev.target.id === 'hoja') cerrarHoja(); };
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('#hoja').hidden) cerrarHoja(); });

function campo(etiqueta, nodo) {
  const c = el('label', 'campo');
  c.append(el('span', null, etiqueta), nodo);
  return c;
}
function entrada(valor, ph, tipo) {
  const i = el('input');
  i.type = tipo || 'text'; i.value = valor || ''; if (ph) i.placeholder = ph;
  i.autocomplete = 'off'; i.spellcheck = false;
  return i;
}
function botones(card, textoOk, alDar, extra) {
  const fila = el('div', 'acciones');
  const cancelar = el('button', null, 'Cancelar');
  cancelar.onclick = cerrarHoja;
  const ok = el('button', 'ok', textoOk);
  ok.onclick = alDar;
  fila.append(cancelar, ok);
  card.append(fila);
  if (extra) card.append(extra);
}
function brindis(txt) {
  const n = el('div', 'brindis', txt);
  document.body.append(n);
  setTimeout(() => n.remove(), 2600);
}

/* --- piezas de las hojas ------------------------------------------------ */

/** Cabecera con la marca de color: dice sobre qué estás actuando sin leer. */
function cabecera(card, titulo, sub, url) {
  const c = el('div', 'hoja-cab');
  if (url) {
    const m = el('div', 'marca', monograma(url, titulo));
    m.style.setProperty('--marca', `var(--${colorDe(url)})`);
    c.append(m);
  }
  const t = el('div', 'hoja-cab-txt');
  t.append(el('div', 'hoja-tit', titulo));
  if (sub) t.append(el('div', 'hoja-sub', sub));
  c.append(t);
  card.append(c);
}

/**
 * Una opción del menú. Si `accion` es una dirección, sale un <a> de verdad,
 * que es lo único que Android entrega a la app; si es una función, un botón.
 */
function opcion(icono, texto, accion, extra) {
  const esEnlace = typeof accion === 'string';
  const n = el(esEnlace ? 'a' : 'button', 'op' + (extra && extra.clase ? ' ' + extra.clase : ''));
  n.append(el('span', 'ic', icono));
  const txt = el('div', 'txt', texto);
  if (extra && extra.nota) txt.append(el('small', null, extra.nota));
  n.append(txt);
  if (esEnlace) {
    n.href = accion; n.target = '_blank'; n.rel = 'noopener';
    n.onclick = () => cerrarHoja();
  } else {
    n.onclick = accion;
  }
  return n;
}

/** Agrupa opciones en una tarjeta. Varias llamadas = varios bloques. */
function grupo(card, ...ops) {
  const g = el('div', 'grupo');
  for (const o of ops) if (o) g.append(o);
  card.append(g);
  return g;
}

/** Lista de secciones de un espacio, con las hijas indentadas por nombre. */
function opcionesSeccion(sp, sel) {
  const s = el('select');
  const ninguna = el('option', null, 'Sin sección');
  ninguna.value = '';
  s.append(ninguna);
  const poner = (sec, prefijo) => {
    const o = el('option', null, prefijo + sec.nombre);
    o.value = sec.id;
    if (sec.id === sel) o.selected = true;
    s.append(o);
    for (const h of sp.secciones.filter((x) => x.parentId === sec.id)) poner(h, prefijo + '› ');
  };
  for (const sec of sp.secciones.filter((x) => !x.parentId)) poner(sec, '');
  return s;
}

/* ------------------------------------------------------------ hoja: nota */
function hojaNota(sp, tipo, id) {
  const clave = claveNota(tipo, id);
  const actual = sp.notas[clave] || null;
  const dueno = tipo === 'l'
    ? sp.ligas.find((x) => x.id === id)
    : sp.secciones.find((x) => x.id === id);
  const titulo = tipo === 'l' ? (dueno?.titulo || 'Liga') : (dueno?.nombre || 'Sección');

  abrirHoja((card) => {
    cabecera(card, actual ? 'Nota' : 'Nueva nota', titulo, tipo === 'l' ? dueno?.url : null);

    const area = el('textarea');
    area.value = actual ? actual.texto : '';
    area.placeholder = 'Para qué es, qué falta, dónde te quedaste…';
    area.rows = 4;
    card.append(campo('Texto', area));

    let color = actual && COLORES.includes(actual.color) ? actual.color : 'yellow';
    const cols = el('div', 'colores');
    for (const c of COLORES) {
      const b = el('button', c === color ? 'sel' : null);
      b.type = 'button';
      b.style.setProperty('--c', `var(--${c})`);
      b.setAttribute('aria-label', c);
      b.onclick = () => { color = c; cols.querySelectorAll('button').forEach((x) => x.classList.remove('sel')); b.classList.add('sel'); };
      cols.append(b);
    }
    card.append(campo('Color', cols));

    botones(card, 'Guardar', async () => {
      const texto = area.value.trim();
      // Vaciarla es quitarla: no hace falta un botón aparte.
      if (!texto) delete sp.notas[clave];
      else sp.notas[clave] = { texto, color, actualizado: Date.now() };
      await guardar(); cerrarHoja(); pintar();
    });

    if (actual) {
      const quitar = el('button', 'foot-btn');
      quitar.style.marginTop = '8px';
      quitar.textContent = 'Quitar la nota';
      quitar.onclick = async () => {
        delete sp.notas[clave];
        await guardar(); cerrarHoja(); pintar();
      };
      card.append(quitar);
    }
  });
}

/* ------------------------------------------------------------ hoja: liga */
function hojaLiga(liga, sp) {
  const esp = sp || espacio();
  abrirHoja((card) => {
    card.append(el('h3', null, liga ? 'Editar liga' : 'Añadir liga'));

    const iUrl = entrada(liga ? liga.url : '', 'https://docs.google.com/…', 'url');
    const iTit = entrada(liga ? liga.titulo : '', 'Cómo la quieres ver');
    const sSec = opcionesSeccion(esp, liga ? liga.seccionId : null);

    const sEsp = el('select');
    for (const s of E.espacios) {
      const o = el('option', null, s.icono + '  ' + s.nombre);
      o.value = s.id;
      if (s.id === esp.id) o.selected = true;
      sEsp.append(o);
    }
    // Cambiar de espacio en el formulario reconstruye la lista de secciones.
    sEsp.onchange = () => {
      const destino = E.espacios.find((s) => s.id === sEsp.value);
      cajaSec.querySelector('select').replaceWith(opcionesSeccion(destino, null));
    };

    card.append(campo('Dirección', iUrl));
    const pista = el('div', 'imp-det');
    pista.style.margin = '-6px 2px 12px';
    const repintarPista = () => { pista.textContent = destinoDe(normalizarUrl(iUrl.value)); };
    repintarPista();
    iUrl.oninput = repintarPista;
    card.append(pista);
    card.append(campo('Nombre', iTit));
    const fila = el('div', 'fila');
    const cajaEsp = campo('Espacio', sEsp);
    const cajaSec = campo('Sección', sSec);
    fila.append(cajaEsp, cajaSec);
    card.append(fila);

    // Si pegas la dirección y no pones nombre, se rellena solo.
    iUrl.onblur = () => { if (!iTit.value.trim()) iTit.value = etiqueta(normalizarUrl(iUrl.value)) || ''; };

    const pegar = el('button', 'foot-btn', 'Pegar del portapapeles');
    pegar.onclick = async () => {
      try {
        const t = await navigator.clipboard.readText();
        if (t) { iUrl.value = t.trim(); iUrl.onblur(); }
      } catch { brindis('El navegador no dejó leer el portapapeles'); }
    };
    card.append(pegar);

    botones(card, liga ? 'Guardar' : 'Añadir', async () => {
      const url = normalizarUrl(iUrl.value);
      if (!esLanzable(url)) return brindis('Esa dirección no se puede abrir');
      const destinoId = sEsp.value;
      const seccionId = (cajaSec.querySelector('select').value) || null;
      const titulo = iTit.value.trim() || etiqueta(url) || url;

      if (liga) {
        // Mover entre espacios = quitar de uno y poner en otro.
        const origen = E.espacios.find((s) => s.ligas.some((x) => x.id === liga.id));
        if (origen && origen.id !== destinoId) {
          origen.ligas = origen.ligas.filter((x) => x.id !== liga.id);
          E.espacios.find((s) => s.id === destinoId).ligas.push(liga);
        }
        Object.assign(liga, { url, titulo, seccionId });
      } else {
        E.espacios.find((s) => s.id === destinoId).ligas.push({ id: uid(), url, titulo, seccionId });
      }
      await guardar(); cerrarHoja(); pintar();
    });
  });
}

function menuLiga(l) {
  abrirHoja((card) => {
    cabecera(card, l.titulo, destinoDe(l.url), l.url);

    grupo(card,
      opcion('↗', 'Abrir', l.url, { clase: 'destacada' }),
      opcion('✎', 'Editar', () => hojaLiga(l)),
      opcion('✍', notaDe(espacio(), 'l', l.id) ? 'Editar la nota' : 'Añadir una nota',
        () => hojaNota(espacio(), 'l', l.id)),
      opcion(l.estrella === false ? '☆' : '★',
        l.estrella === false ? 'Ponerle estrella' : 'Quitarle la estrella',
        async () => {
          l.estrella = l.estrella === false;
          await guardar(); cerrarHoja(); pintar();
          brindis(l.estrella ? 'Con estrella' : 'Marcada de paso');
        },
        { nota: l.estrella === false ? 'Deja de ser de paso' : 'Pasa a ser de paso' }),
      opcion('⧉', 'Copiar dirección', async () => {
        try { await navigator.clipboard.writeText(l.url); brindis('Copiada'); }
        catch { brindis('No se pudo copiar'); }
        cerrarHoja();
      })
    );

    grupo(card,
      opcion('⚲', 'Anclar a todos los espacios', async () => {
        if (!E.ancladas.some((a) => a.url === l.url)) E.ancladas.push({ id: uid(), url: l.url, titulo: l.titulo });
        await guardar(); cerrarHoja(); pintar(); brindis('Anclada');
      }),
      opcion('↑', 'Subir', () => mover(l, -1)),
      opcion('↓', 'Bajar', () => mover(l, 1))
    );

    grupo(card,
      opcion('✕', 'Quitar del espacio', async () => {
        const sp = E.espacios.find((s) => s.ligas.some((x) => x.id === l.id));
        if (sp) { sp.ligas = sp.ligas.filter((x) => x.id !== l.id); delete sp.notas['l:' + l.id]; }
        await guardar(); cerrarHoja(); pintar();
      }, { clase: 'mal' })
    );
  });
}

/** Sube o baja la liga dentro de su propio grupo (sueltas o su sección). */
async function mover(l, paso) {
  const sp = E.espacios.find((s) => s.ligas.some((x) => x.id === l.id));
  if (!sp) return;
  const grupo = sp.ligas.filter((x) => (x.seccionId || null) === (l.seccionId || null));
  const i = grupo.indexOf(l);
  const j = i + paso;
  if (j < 0 || j >= grupo.length) { cerrarHoja(); return; }
  const otra = grupo[j];
  const a = sp.ligas.indexOf(l), b = sp.ligas.indexOf(otra);
  sp.ligas[a] = otra; sp.ligas[b] = l;
  await guardar(); cerrarHoja(); pintar();
}
